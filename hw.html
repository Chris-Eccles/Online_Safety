<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework · Abity</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/site.css">
<script src="/a11y.js" defer></script>
<style>
.hw-head{border-top:5px solid var(--navy)}
.hw-head h1{font-size:2rem;color:var(--navy);margin-bottom:4px}
.meta{color:var(--muted);margin:0 0 6px}
.intro{margin:12px 0 0;white-space:pre-line}
.sec-h{font-family:var(--head);font-weight:600;font-size:1.4rem;color:var(--navy);margin:30px 0 10px}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px}
.q-top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.q-text{white-space:pre-wrap;font-weight:600;margin:0}
.q-num{font-family:var(--head);color:var(--navy);margin-right:6px}
.marks{flex:0 0 auto;font-size:13px;font-weight:800;color:var(--muted);background:var(--lock-soft);border-radius:999px;padding:3px 10px}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600}
.opt:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.opt input{margin-top:4px;accent-color:var(--navy);width:18px;height:18px;flex:0 0 auto}
.q input[type=text]{margin-top:12px;max-width:420px;font-family:"JetBrains Mono",ui-monospace,monospace}
.q textarea{display:block;width:100%;margin-top:12px;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--field);border-radius:10px;resize:vertical;min-height:90px}
.q textarea:focus,.q input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px;font-size:15px}
.fb.full{background:var(--ok-soft);color:#14532d}.fb.part{background:var(--amber-soft);color:#78350f}.fb.none{background:var(--bad-soft);color:#7f1d1d}
.who{margin-top:24px}
.groups{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
.groups button{font-size:1.3rem}
.result{border-top:5px solid var(--ok);text-align:left}
.result .big{font-family:var(--head);font-size:2.6rem;color:var(--navy);margin:4px 0}
.saved{font-size:14px;color:var(--muted);margin:8px 0 0}
.fu{border-top:5px solid var(--navy);text-align:left}
.fu .task{white-space:pre-wrap;font-weight:600;font-size:1.1rem;margin:10px 0 0;padding:14px 16px;background:var(--navy-soft);border-radius:10px}
.fu textarea{display:block;width:100%;margin-top:12px;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--field);border-radius:10px;resize:vertical;min-height:130px}
.fu textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
.q.fu-target{border:2px solid var(--navy);box-shadow:0 0 0 4px var(--navy-soft)}
.exam .ex-l{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.exam .ex-q{margin:0;font-weight:600}
.exam pre{margin:0;padding:12px 14px;background:var(--lock-soft);border-radius:10px;white-space:pre-wrap;font:inherit;font-size:16px}
.exam pre.ex-c{background:#fff;border:2px dashed var(--field)}
.exam select{font:inherit;font-size:17px;padding:8px 10px;border:1px solid var(--field);border-radius:8px;margin-top:4px}
.review-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.review-h small{color:var(--muted);font-family:var(--body);font-size:14px;font-weight:600}
.qry{margin-top:8px}
.qry button.linkish{background:none;border:0;padding:0;color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline;font-size:14px}
.qry textarea{min-height:70px!important;font-size:15px!important}
.marking{position:fixed;inset:0;z-index:100;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:grayscale(1) blur(2px)}
.marking .mbox{background:#fff;border-radius:18px;border-top:6px solid var(--navy);max-width:460px;width:100%;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.marking h2{font-family:var(--head);font-weight:600;color:var(--navy);margin:0 0 6px;font-size:1.6rem}
.marking .mstage{margin:0 0 16px;min-height:2.8em;color:var(--ink);font-weight:600}
.marking .mtrack{height:14px;background:var(--lock-soft);border-radius:999px;overflow:hidden}
.marking .mtrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),#3B6FA8);border-radius:999px;transition:width .5s linear}
.marking .mtime{display:flex;justify-content:space-between;margin:8px 0 0;font-size:14px;color:var(--muted);font-weight:700}
.marking .mnote{margin:14px 0 0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.marking .mtrack i{transition:none}}
.fu-res{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--navy-soft)}
fieldset{border:0;padding:0;margin:0}
legend{padding:0}
/* Copy and paste are off: question text can't be selected; answers can. The accessibility panel's assistive tools mode turns this off. */
html:not(.a11y-assist) main{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html:not(.a11y-assist) main input,html:not(.a11y-assist) main textarea,html:not(.a11y-assist) main select{-webkit-user-select:text;user-select:text}
#nocp{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E3A5F;color:#fff;padding:10px 18px;border-radius:8px;font:600 .95rem system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
#nocp.on{opacity:1}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <img src="/brand/mgs-logo-white.png" alt="Maidstone Grammar School">
  <span class="who-bar">Homework</span>
</div></header>

<div class="hw-progress hidden" id="prog"><div class="in">
  <span id="prog-txt">0 of 0 answered</span><span class="bar2" aria-hidden="true"><i id="prog-bar"></i></span>
  <button class="btn" type="button" id="to-submit" style="min-height:40px;padding:8px 16px;font-size:15px">Go to hand in ↓</button>
</div></div>
<main style="max-width:860px">
  <p id="msg" class="lede">Loading…</p>
  <div id="app" class="hidden">
    <section class="card hw-head">
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
      <p class="intro" id="intro"></p>
    </section>

    <section class="card who" id="who">
      <div class="stack">
        <label for="name">Your full name</label>
        <input id="name" type="text" autocomplete="off" maxlength="60" placeholder="First name and surname">
        <p class="hint">Only sent to your teacher with your answers. It is not stored on the website.</p>
        <span style="font-weight:700;font-size:15px" id="group-label">Your group</span>
        <div class="groups" id="groups" role="group" aria-labelledby="group-label"></div>
      </div>
    </section>

    <div id="questions"></div>

    <section class="card stack" id="submit-box" style="margin-top:20px">
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="button" id="submit">Hand in homework</button>
      <p class="saved" id="saved">Your answers save on this device as you type, so you can come back to them.</p>
    </section>
  </div>
</main>

<footer><div class="in">
  <span>Abity · Computer Science at Maidstone Grammar School</span>
  <span><a href="/privacy">Privacy notice</a></span>
</div></footer>

<script src="/api.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); };
  var FN = "https://gnxgefgjsgtqgclyvblh.supabase.co/functions/v1/hw-submit";
  var KEY = "sb_publishable_D5eUj-rOFB4cBzLX67hMfA_HlzSIHlu";
  var q = new URLSearchParams(location.search);
  var code = (location.pathname.match(/^\/hw\/([a-z0-9]{6,12})$/) || [])[1] || q.get("c") || "";
  var preview = q.get("preview") === "1";
  var store = "abity-hw-" + code, S = {}, group = null, HW = null, curQ = null, curT = 0;
  try { S = JSON.parse(localStorage.getItem(store) || "{}") || {}; } catch (e) {}
  S.answers = S.answers || {}; S.pastes = S.pastes || {}; S.seconds = S.seconds || {}; S.away = S.away || 0;
  function save() { if (preview) return; try { localStorage.setItem(store, JSON.stringify(S)); } catch (e) {} }

  if (!code) { $("msg").textContent = "This homework link isn't complete. Check the link your teacher shared."; return; }

  Abity.rpc("site_hw", { p_code: code }).then(function (r) {
    if (!r.ok) {
      $("msg").textContent = r.closed ? "“" + r.title + "” is closed. Speak to your teacher if you still need to hand it in." : "This homework link isn't valid. Check the link your teacher shared.";
      return;
    }
    HW = r; render(r);
  }).catch(function () { $("msg").textContent = "We can't reach the website's server. Check your internet connection, then refresh the page."; });

  function render(r) {
    var hw = r.hw;
    document.title = hw.title + " · Homework";
    $("title").textContent = hw.title;
    $("meta").textContent = [hw.spec, "Year " + r.year, hw.totalMarks + " marks"].filter(Boolean).join(" · ");
    $("intro").textContent = hw.intro || "";
    if (preview) { $("who").classList.add("hidden"); $("submit-box").innerHTML = '<p class="lede" style="margin:0"><b>Preview:</b> this is what students see. Hand-in is switched off here.</p>'; }

    $("groups").innerHTML = r.groups.map(function (g) {
      return '<button type="button" data-g="' + esc(g) + '" aria-pressed="false">' + r.year + esc(g) + '</button>';
    }).join("") || '<p class="hint">No groups set up for this year yet. Tell your teacher.</p>';
    if (S.name) $("name").value = S.name;
    if (S.group && r.groups.indexOf(S.group) >= 0) pick(S.group);

    var html = "";
    hw.sections.forEach(function (s) {
      if (s.name) html += '<h2 class="sec-h">' + esc(s.name) + '</h2>';
      s.questions.forEach(function (qq) { html += qBox(qq, qq.id); });
    });
    $("questions").innerHTML = html;
    loadReview();
    setupCode();
    $("msg").classList.add("hidden"); $("app").classList.remove("hidden");
    if (!S.started && !preview) { S.started = new Date().toISOString(); save(); }
    if (S.done) showResult(S.done);
    else if (S.pending) showFollowUp(S.pending);
    if (!preview && !S.done && !S.pending) $("prog").classList.remove("hidden");
    progress();
  }

  // One question's box. key is the answer's name: "q3", or "r:<homework>:q3" for a personal review question.
  function qBox(qq, key, label) {
        var a = S.answers[key] || "", box, qid = key;
        if (qq.type === "mcq") {
          box = '<fieldset class="opts"><legend class="sr">Options</legend>' + qq.options.map(function (o) {
            return '<label class="opt"><input type="radio" name="' + qid + '" value="' + o.key + '"' + (a === o.key ? " checked" : "") + '><span>' + o.key + ') ' + esc(o.text) + '</span></label>';
          }).join("") + '</fieldset>';
        } else if (qq.type === "tf") {
          box = '<fieldset class="opts"><legend class="sr">True or false</legend>' + ["true", "false"].map(function (v) {
            return '<label class="opt"><input type="radio" name="' + qid + '" value="' + v + '"' + (a === v ? " checked" : "") + '><span>' + (v === "true" ? "True" : "False") + '</span></label>';
          }).join("") + '</fieldset>';
        } else if (qq.type === "quick" || qq.type === "short") {
          box = '<label class="sr" for="in-' + qid + '">Answer to question ' + qq.num + '</label><input type="text" id="in-' + qid + '" data-q="' + qid + '" autocomplete="off" spellcheck="false" value="' + esc(a) + '">';
        } else if (qq.type === "code") {
          box = '<textarea id="in-' + qid + '" name="' + qid + '" data-q="' + qid + '" data-code="1" data-label="Question ' + qq.num + '" data-tests="' + esc(JSON.stringify(qq.tests || [])) + '">' + esc(a || qq.starter || "") + '</textarea>';
        } else if (qq.type === "examiner") {
          var ex = {}; try { ex = JSON.parse(a || "{}") || {}; } catch (e) {}
          var opts = '<option value="">Choose</option>'; for (var m = 0; m <= qq.origMarks; m++) opts += '<option value="' + m + '"' + (String(ex.mark) === String(m) ? " selected" : "") + '>' + m + '</option>';
          box = '<div class="exam"><p class="ex-l">The exam question</p><p class="ex-q">' + esc(qq.original) + ' [' + qq.origMarks + ']</p>' +
            '<p class="ex-l">A student\u2019s answer</p><pre class="ex-c">' + esc(qq.candidate) + '</pre>' +
            (qq.shown ? '<p class="ex-l">Mark scheme</p><pre>' + esc(qq.shown) + '</pre>' : '') +
            '<p class="ex-l"><label for="exm-' + qid + '">Your mark out of ' + qq.origMarks + '</label></p><select id="exm-' + qid + '" data-exmark="' + qid + '">' + opts + '</select>' +
            '<p class="ex-l"><label for="exw-' + qid + '">Why did you give that mark?</label></p><textarea id="exw-' + qid + '" data-exwhy="' + qid + '" rows="4">' + esc(ex.why || "") + '</textarea></div>';
        } else {
          box = '<label class="sr" for="in-' + qid + '">Answer to question ' + qq.num + '</label><textarea id="in-' + qid + '" data-q="' + qid + '" rows="' + Math.min(14, 3 + qq.marks * 2) + '">' + esc(a) + '</textarea>';
        }
        return '<div class="q" id="box-' + qid + '" data-qbox="' + qid + '"><div class="q-top"><p class="q-text"><span class="q-num">' + esc(label || qq.num + ".") + '</span>' + esc(qq.text) + '</p><span class="marks">' + qq.marks + (qq.marks === 1 ? " mark" : " marks") + '</span></div>' + box + '<div class="fb hidden" id="fb-' + qid + '"></div></div>';
  }

  // Code questions use the CodeBox editor (real Python, run in this browser)
  function setupCode() {
    var tas = document.querySelectorAll("textarea[data-code]");
    if (!tas.length) return;
    var sc = document.createElement("script"); sc.src = "/codebox.js";
    sc.onload = function () {
      tas.forEach(function (ta) {
        var q = findQ(ta.dataset.q);
        window.CodeBox.build(ta, (q && q.starter) || "", { key: "abity-hw-" + code, lang: "py" });
        if (S.done || S.pending) ta.disabled = true;
      });
    };
    document.head.appendChild(sc);
  }
  function findQ(id) {
    var all = [].concat.apply([], HW.hw.sections.map(function (s) { return s.questions; }));
    return all.filter(function (x) { return x.id === id; })[0];
  }
  function exSave(id) {
    var m = document.querySelector('[data-exmark="' + id + '"]'), w = document.querySelector('[data-exwhy="' + id + '"]');
    S.answers[id] = (m.value === "" && !w.value.trim()) ? "" : JSON.stringify({ mark: m.value === "" ? null : Number(m.value), why: w.value });
    save(); progress();
  }

  // Personal review: questions this device got wrong in earlier homeworks come back after 3, 7, 21 and 60 days.
  // The list is kept on this device only; the website never stores who got what wrong.
  var REV = "abity-review", DAYS = [3, 7, 21, 60], reviewItems = [];
  function revList() { try { return JSON.parse(localStorage.getItem(REV) || "[]") || []; } catch (e) { return []; } }
  function revSave(l) { try { localStorage.setItem(REV, JSON.stringify(l.slice(-200))); } catch (e) {} }
  function loadReview() {
    if (preview) return;
    var now = Date.now();
    if (!S.reviewPick) {
      S.reviewPick = revList().filter(function (x) { return x.code !== code && x.due <= now; }).sort(function (a, b) { return a.due - b.due; }).slice(0, 2)
        .map(function (x) { return { code: x.code, qid: x.qid }; });
      save();
    }
    if (!S.reviewPick.length) return;
    Abity.rpc("site_hw_review", { p_codes: S.reviewPick.map(function (x) { return x.code; }) }).then(function (r) {
      if (!r || !r.ok) return;
      reviewItems = S.reviewPick.map(function (x) {
        var h = r.homeworks[x.code]; if (!h) return null;
        var q = [].concat.apply([], h.student.sections.map(function (s) { return s.questions; })).filter(function (y) { return y.id === x.qid; })[0];
        return q && q.type !== "code" && q.type !== "examiner" ? { code: x.code, qid: x.qid, key: "r:" + x.code + ":" + x.qid, q: q, title: h.title } : null;
      }).filter(Boolean);
      if (!reviewItems.length) return;
      var html = '<h2 class="sec-h review-h">Your personal review <small>Questions you found tricky before. They don\u2019t count towards your score.</small></h2>';
      reviewItems.forEach(function (it, i) { html += qBox(it.q, it.key, "R" + (i + 1) + "."); });
      var d = document.createElement("div"); d.id = "review"; d.innerHTML = html;
      $("questions").appendChild(d);
      if (S.done || S.pending) { lockAndMark(S.done || S.pending); }
    }).catch(function () {});
  }
  function reviewPayload() { return reviewItems.map(function (it) { return { code: it.code, qid: it.qid, answer: S.answers[it.key] || "" }; }); }
  function reviewUpdate(r) {
    if (S.reviewUpdated) return;
    var l = revList(), now = Date.now(), day = 864e5;
    (r.review || []).forEach(function (x) {
      var p = x.id.split(":"), i = l.findIndex(function (y) { return y.code === p[1] && y.qid === p[2]; });
      if (i < 0) return;
      if (x.awarded === x.marks) { l[i].box++; if (l[i].box >= DAYS.length) l.splice(i, 1); else l[i].due = now + DAYS[l[i].box] * day; }
      else { l[i].box = 0; l[i].due = now + DAYS[0] * day; }
    });
    r.results.forEach(function (x) {
      var q = findQ(x.id); if (!q || q.type === "code" || q.type === "examiner" || x.awarded >= x.marks) return;
      l = l.filter(function (y) { return !(y.code === code && y.qid === x.id); });
      l.push({ code: code, qid: x.id, num: x.num, title: HW.hw.title, box: 0, due: now + DAYS[0] * day });
    });
    revSave(l); S.reviewUpdated = true; save();
  }
  function progress() {
    if (!HW) return;
    var all = [].concat.apply([], HW.hw.sections.map(function (s) { return s.questions; }));
    var n = all.filter(function (x) { return String(S.answers[x.id] || "").trim(); }).length;
    $("prog-txt").textContent = n + " of " + all.length + " answered";
    $("prog-bar").style.width = (all.length ? 100 * n / all.length : 0) + "%";
  }
  $("to-submit").addEventListener("click", function () { $("submit-box").scrollIntoView({ behavior: "smooth", block: "center" }); });

  function pick(g) {
    group = g; S.group = g; save();
    $("groups").querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.g === g)); });
  }
  $("groups").addEventListener("click", function (e) { var b = e.target.closest("[data-g]"); if (b && !S.done) pick(b.dataset.g); });
  $("name").addEventListener("input", function () { S.name = this.value; save(); });

  // Answers, pastes and time spent on each question (all sent with the hand-in, for your teacher)
  document.addEventListener("input", function (e) {
    var id = e.target.dataset && e.target.dataset.q; if (id) { S.answers[id] = e.target.value; save(); progress(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.type === "radio") { S.answers[e.target.name] = e.target.value; save(); progress(); }
    if (e.target.dataset && e.target.dataset.exmark) exSave(e.target.dataset.exmark);
  });
  document.addEventListener("input", function (e) { if (e.target.dataset && e.target.dataset.exwhy) exSave(e.target.dataset.exwhy); });
  // Copy and paste are switched off (assistive tools mode in the accessibility panel allows them, and your teacher is told).
  // Blocked paste attempts are still counted for the teacher.
  var nocpT;
  function noCP(e, msg) {
    if (document.documentElement.classList.contains("a11y-assist")) return false;
    e.preventDefault();
    var t = $("nocp"); if (!t) { t = document.createElement("div"); t.id = "nocp"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.classList.add("on"); clearTimeout(nocpT); nocpT = setTimeout(function () { t.classList.remove("on"); }, 2200);
    return true;
  }
  ["copy", "cut"].forEach(function (ev) { document.addEventListener(ev, function (e) { noCP(e, "Copying is switched off for this work."); }, true); });
  document.addEventListener("paste", function (e) { noCP(e, "Pasting is switched off: type your answer."); }, true);
  document.addEventListener("drop", function (e) { if (e.target.closest && e.target.closest("textarea, input")) noCP(e, "Pasting is switched off: type your answer."); }, true);
  document.addEventListener("dragstart", function (e) { if (!(e.target.closest && e.target.closest("textarea, input"))) noCP(e, "Copying is switched off for this work."); }, true);
  document.addEventListener("beforeinput", function (e) {
    if (e.inputType === "insertFromPaste" || e.inputType === "insertFromDrop" || e.inputType === "insertFromPasteAsQuotation") noCP(e, "Pasting is switched off: type your answer.");
  }, true);
  document.addEventListener("contextmenu", function (e) { if (!(e.target.closest && e.target.closest("textarea, input"))) noCP(e, "Copying is switched off for this work."); }, true);
  document.addEventListener("paste", function (e) {
    var id = e.target.dataset && (e.target.dataset.q || e.target.dataset.exwhy); if (id) { S.pastes[id] = (S.pastes[id] || 0) + 1; save(); }
  });
  function stopTimer() { if (curQ) { S.seconds[curQ] = (S.seconds[curQ] || 0) + (Date.now() - curT) / 1000; curQ = null; save(); } }
  document.addEventListener("focusin", function (e) {
    var box = e.target.closest && e.target.closest("[data-qbox]");
    var id = box && box.dataset.qbox;
    if (id === curQ) return;
    stopTimer(); if (id) { curQ = id; curT = Date.now(); }
  });
  // Assistive tools switched on in the accessibility panel at any point: your teacher is told (pastes are expected then)
  document.addEventListener("a11y-change", function (e) { if (e.detail && e.detail.assist && !S.done) { S.assist = true; save(); } });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { stopTimer(); if (!S.done && !preview && HW) { S.away = (S.away || 0) + 1; save(); } }
  });

  $("submit").addEventListener("click", function () {
    if (!HW || preview) return;
    var err = $("err"), name = Abity.nameCase($("name").value);
    if (name.length < 3 || name.indexOf(" ") < 0) { err.textContent = "Type your first name and surname at the top."; $("name").focus(); return; }
    if (!group) { err.textContent = "Pick your group at the top."; return; }
    var all = [].concat.apply([], HW.hw.sections.map(function (s) { return s.questions; }));
    var blank = all.filter(function (x) { return !String(S.answers[x.id] || "").trim(); }).length;
    if (!confirm((blank ? "You have " + blank + " unanswered question" + (blank > 1 ? "s" : "") + ". " : "") + "Hand in now? You can only hand in once.")) return;
    stopTimer();
    var btn = this; btn.disabled = true; btn.textContent = "Marking…"; err.textContent = "";
    var stop = marking("handin");
    fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY },
      body: JSON.stringify({ code: code, name: name, group: group, answers: mainAnswers(), review: reviewPayload(),
        meta: { started: S.started, pastes: S.pastes, seconds: S.seconds, away: S.away, assist: !!(S.assist || window.hwAssist), code: codeChecks() } }) })
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (x) {
        stop();
        if (x.body && x.body.ok && x.body.stage === "followup") { S.pending = x.body; save(); showFollowUp(x.body); return; }
        if (x.body && x.body.ok) { S.done = x.body; save(); showResult(x.body); return; }
        err.textContent = (x.body && x.body.error) || "Something went wrong. Try again.";
        btn.disabled = false; btn.textContent = "Hand in homework";
        if (x.body && x.body.already) { btn.classList.add("hidden"); }
      })
      .catch(function () { stop(); err.textContent = "We can't reach the server. Your answers are saved on this device: try again when you're back online."; btn.disabled = false; btn.textContent = "Hand in homework"; });
  });

  // While the three markers work (often up to a minute) the page is greyed out with a progress bar, a countdown and
  // what is happening now, so students wait instead of refreshing. The bar slows near the end and fills when marking is done.
  function marking(kind) {
    var est = kind === "followup" ? 40 : 60, t0 = Date.now(), done = false;
    var steps = kind === "followup"
      ? [[0, "Sending your answer"], [4, "Two markers are reading your answer"], [18, "A third marker is checking if they disagree"], [28, "Writing your feedback and sending your work to your teacher"]]
      : [[0, "Handing in your answers"], [3, "Marking the multiple-choice and quick answers"], [8, "Two markers are reading your written answers"], [28, "A third marker is checking anything they disagreed on"], [42, "Choosing your follow-up task and writing your feedback"]];
    var ov = document.createElement("div");
    ov.className = "marking"; ov.setAttribute("role", "dialog"); ov.setAttribute("aria-modal", "true"); ov.setAttribute("aria-labelledby", "mk-h");
    ov.innerHTML = '<div class="mbox"><h2 id="mk-h">Marking your work</h2><p class="mstage" id="mk-s" aria-live="polite"></p>' +
      '<div class="mtrack" role="progressbar" aria-label="Marking progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="mk-bar"></i></div>' +
      '<p class="mtime"><span id="mk-el">0:00</span><span id="mk-left"></span></p>' +
      '<p class="mnote">Three markers check written answers, so this can take up to a minute. Keep this page open.</p></div>';
    document.body.appendChild(ov); document.body.style.overflow = "hidden";
    var warn = function (e) { e.preventDefault(); e.returnValue = ""; };
    window.addEventListener("beforeunload", warn);
    var mm = function (n) { return Math.floor(n / 60) + ":" + ("0" + Math.floor(n % 60)).slice(-2); };
    function tick() {
      if (done) return;
      var t = (Date.now() - t0) / 1000, pc = 95 * (1 - Math.exp(-t / (est / 2.5)));
      ov.querySelector("#mk-bar").style.width = pc.toFixed(1) + "%";
      ov.querySelector(".mtrack").setAttribute("aria-valuenow", Math.round(pc));
      ov.querySelector("#mk-el").textContent = mm(t);
      var left = Math.ceil(est - t);
      ov.querySelector("#mk-left").textContent = left > 0 ? "about " + left + " second" + (left === 1 ? "" : "s") + " left" : "taking a little longer than usual";
      var st = steps.filter(function (x) { return t >= x[0]; }).pop()[1];
      if (t > est + 15) st = "Nearly there: thanks for waiting";
      var el = ov.querySelector("#mk-s"); if (el.textContent !== st) el.textContent = st;
      setTimeout(tick, 500);
    }
    tick();
    return function () {
      if (done) return; done = true;
      window.removeEventListener("beforeunload", warn);
      ov.querySelector("#mk-bar").style.width = "100%";
      ov.querySelector("#mk-s").textContent = "Done";
      setTimeout(function () { ov.remove(); document.body.style.overflow = ""; }, 450);
    };
  }

  function mainAnswers() { var o = {}; Object.keys(S.answers).forEach(function (k) { if (/^q\d+$/.test(k)) o[k] = S.answers[k]; }); return o; }
  function codeChecks() {
    var o = {}; if (!window.CodeBox) return o;
    document.querySelectorAll("textarea[data-code]").forEach(function (ta) { var st = window.CodeBox.status(ta.name); if (st) o[ta.name] = st; });
    return o;
  }
  function byNote(by) {
    return by === "needs moderation" ? " <i>(your teacher will confirm this mark)</i>" : /^AI/.test(by) || by === "AI-suggested" ? " <i>(AI-marked)</i>" : "";
  }
  function lockAndMark(r) {
    $("prog").classList.add("hidden");
    document.querySelectorAll("#questions input, #questions textarea, #questions select, #name, #groups button").forEach(function (el) { el.disabled = true; });
    r.results.concat(r.review || []).forEach(function (x) {
      var fb = $("fb-" + x.id); if (!fb) return;
      fb.className = "fb " + (x.awarded === x.marks ? "full" : x.awarded ? "part" : "none");
      fb.innerHTML = "<b>" + x.awarded + "/" + x.marks + "</b> · " + esc(x.feedback) + byNote(x.by);
    });
  }
  function fuTitle(f) { return f.kind === "stretch" ? "Stretch question" : "Follow-up on question " + f.num; }

  // Feedback that leads to a task: the homework only reaches your teacher once this is done
  function showFollowUp(r) {
    lockAndMark(r);
    var f = r.followup, box = $("submit-box"), fuStart = 0;
    if (f.kind !== "stretch") r.results.forEach(function (x) { if (x.num === f.num && $("box-" + x.id)) $("box-" + x.id).classList.add("fu-target"); });
    box.className = "card fu stack";
    box.innerHTML = '<div class="eyebrow">One more step</div>' +
      '<p style="margin:0">Your score so far: <b>' + r.score + ' / ' + r.total + '</b> (' + r.percent + '%). Feedback is under each question.</p>' +
      '<p style="margin:0">' + (f.kind === "stretch" ? "Full marks. Try this harder question" : "Now use your feedback on this task") +
      '. <b>Your homework goes to your teacher when you send it.</b></p>' +
      '<label for="fu-in" style="font-weight:700;margin-top:6px">' + esc(fuTitle(f)) + ' <span class="marks">' + f.marks + (f.marks === 1 ? " mark" : " marks") + '</span></label>' +
      '<p class="task" id="fu-task">' + esc(f.prompt) + '</p>' +
      '<textarea id="fu-in" rows="6">' + esc(S.fuAnswer || "") + '</textarea>' +
      '<p class="err" id="fu-err" role="alert"></p>' +
      '<button class="btn" type="button" id="fu-send">Send to my teacher</button>' +
      '<p class="saved">Your answer saves on this device as you type. Come back to this page on the same device if you need to finish later.</p>';
    var inp = $("fu-in");
    inp.addEventListener("input", function () { S.fuAnswer = this.value; save(); });
    inp.addEventListener("paste", function () { S.fuPastes = (S.fuPastes || 0) + 1; save(); });
    inp.addEventListener("focus", function () { fuStart = Date.now(); });
    inp.addEventListener("blur", function () { if (fuStart) { S.fuSeconds = (S.fuSeconds || 0) + (Date.now() - fuStart) / 1000; fuStart = 0; save(); } });
    $("fu-send").addEventListener("click", function () {
      var err = $("fu-err"), ans = inp.value;
      if (!ans.trim()) { err.textContent = "Write your answer to the task first."; inp.focus(); return; }
      if (fuStart) { S.fuSeconds = (S.fuSeconds || 0) + (Date.now() - fuStart) / 1000; fuStart = Date.now(); save(); }
      var btn = this; btn.disabled = true; btn.textContent = "Marking…"; err.textContent = "";
      var stop = marking("followup");
      fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY },
        body: JSON.stringify({ action: "followup", code: code, name: Abity.nameCase(S.name || ""), group: S.group, pending: r.pending, secret: r.secret,
          answer: ans, meta: { seconds: S.fuSeconds || 0, pastes: S.fuPastes || 0 } }) })
        .then(function (res) { return res.json().then(function (b) { return { status: res.status, body: b }; }); })
        .then(function (x) {
          stop();
          if (x.body && x.body.ok) { S.done = x.body; delete S.pending; save(); showResult(x.body); return; }
          err.textContent = (x.body && x.body.error) || "Something went wrong. Try again.";
          btn.disabled = false; btn.textContent = "Send to my teacher";
          if (x.body && x.body.expired) btn.classList.add("hidden");
        })
        .catch(function () { stop(); err.textContent = "We can't reach the server. Your answer is saved on this device: try again when you're back online."; btn.disabled = false; btn.textContent = "Send to my teacher"; });
    });
    box.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function showResult(r) {
    lockAndMark(r);
    if (!preview) reviewUpdate(r);
    addQueries(r);
    var f = r.followup;
    $("submit-box").className = "card result";
    $("submit-box").innerHTML = '<div class="eyebrow">Handed in</div><div class="big">' + r.score + ' / ' + r.total + '</div>' +
      (f ? '<p style="margin:0 0 8px;font-weight:700">' + esc(fuTitle(f)) + ': ' + f.awarded + ' / ' + f.marks + '</p>' : '') +
      '<p style="margin:0">' + r.percent + '%. Your teacher has your answers. ' +
      (r.needsChecking ? "Some answers will be checked by your teacher. " : "") + 'Feedback is under each question. Written answers are marked by three AI markers: your teacher has the final say, and you can query a mark under its feedback.</p>' +
      (r.review && r.review.length ? '<p style="margin:8px 0 0"><b>Personal review:</b> ' + r.review.filter(function (x) { return x.awarded === x.marks; }).length + ' of ' + r.review.length + ' remembered.</p>' : '') +
      (f ? '<div class="fu-res"><b>' + esc(fuTitle(f)) + '</b><p style="margin:6px 0;white-space:pre-wrap">' + esc(f.prompt) + '</p><p style="margin:0">' + esc(f.feedback) + byNote(f.by) + '</p></div>' : '') +
      '<p class="saved"><button class="back" type="button" id="again">Start again</button> (only works if your teacher has allowed a redo)</p>';
    $("again").addEventListener("click", function () {
      if (!confirm("Clear your answers on this device and start again?")) return;
      try { localStorage.removeItem(store); } catch (e) {} location.reload();
    });
    $("submit-box").scrollIntoView({ behavior: "smooth", block: "center" });
  }
  // "Query this mark": a short note to the teacher about one AI-marked answer
  function addQueries(r) {
    S.queried = S.queried || {};
    r.results.forEach(function (x) {
      var fb = $("fb-" + x.id); if (!fb || !(/^AI|needs/.test(x.by) || x.by === "AI-suggested")) return;
      var d = document.createElement("div"); d.className = "qry";
      if (S.queried[x.id]) { d.innerHTML = "<small>Query sent to your teacher.</small>"; fb.appendChild(d); return; }
      d.innerHTML = '<button type="button" class="linkish">Query this mark</button>';
      fb.appendChild(d);
      d.querySelector("button").addEventListener("click", function () {
        d.innerHTML = '<label class="sr" for="qn-' + x.id + '">Why should the mark change?</label><textarea id="qn-' + x.id + '" maxlength="600" placeholder="Say which part of your answer you think earns a mark, and why."></textarea>' +
          '<p class="err" role="alert"></p><button class="btn ghost" type="button" style="min-height:40px;padding:8px 16px;font-size:15px">Send to my teacher</button>';
        var ta = d.querySelector("textarea"), er = d.querySelector(".err"), b = d.querySelector(".btn"); ta.focus();
        b.addEventListener("click", function () {
          if (ta.value.trim().length < 5) { er.textContent = "Say why you think the mark should change."; return; }
          b.disabled = true; er.textContent = "";
          fetch(FN, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY },
            body: JSON.stringify({ action: "query", code: code, name: Abity.nameCase(S.name || ""), group: S.group, question: String(x.num), note: ta.value }) })
            .then(function (res) { return res.json(); })
            .then(function (j) {
              if (j && j.ok) { S.queried[x.id] = true; save(); d.innerHTML = "<small>Query sent to your teacher.</small>"; }
              else { er.textContent = (j && j.error) || "Not sent. Try again."; b.disabled = false; }
            }).catch(function () { er.textContent = "Not sent: check your connection."; b.disabled = false; });
        });
      });
    });
  }
})();
</script>
<script src="/nav.js"></script>
