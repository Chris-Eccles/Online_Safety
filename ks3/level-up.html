<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level Up Handbook</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/ks3/fonts.css">
<style>
/* Layout: arcade cabinet — sticky HUD (name + XP) on top, lesson "world map" tabs, then one lesson at a time: core quest → tiered side-quests. Single dark look by choice. */
:root{
  --bg:#13121c; --panel:#1c1b29; --panel2:#252437; --line:#34324a;
  --ink:#ecebf5; --muted:#a4a2bd; --accent:#ffcc33; --ok:#3ddc84; --warn:#ff6b6b;
  --bronze:#d8925c; --silver:#c7cfdc; --gold:#ffcc33; --legend:#ff6fb0;
  --f-display:"Pixelify Sans", "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.5px;color:var(--accent);white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
.who{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 260px}
.who input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 10px;min-width:0;flex:1 1 120px;font-size:16px}
.xp{flex:1 1 220px;min-width:0}
.xp-top{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:15px}
.xp-top b{color:var(--accent)}
.bar{height:12px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,#e6b41f 10px 12px);transition:width .4s}

/* map tabs */
.map{display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px;scrollbar-width:thin}
.map button{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 12px;text-align:left;min-width:96px}
.map button .n{font-family:var(--f-display);font-size:13px;display:block;color:var(--muted)}
.map button .t{font-size:14px;color:var(--ink);font-weight:700}
.map button[aria-selected="true"]{border-color:var(--accent);background:var(--panel2);box-shadow:0 3px 0 var(--accent)}
.map button[aria-selected="true"] .n{color:var(--accent)}
.map .sep{flex:0 0 1px;background:var(--line);margin:4px 2px}

/* lesson head */
.lhead{padding:22px 0 8px}
.eyebrow{font-family:var(--f-display);color:var(--accent);font-size:15px;letter-spacing:1px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.3px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1;margin-top:4px}
h2{font-size:24px;margin:34px 0 10px;display:flex;align-items:center;gap:10px}
h3{font-size:19px}
.lede{color:var(--muted);max-width:65ch;margin:8px 0 0}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.goals span{font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted)}
.goals span b{color:var(--ink)}

/* core quest */
.core{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px 16px;margin-top:6px}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:16px 0;border-bottom:1px dashed var(--line)}
.step:last-of-type{border-bottom:0}
.step .num{font-family:var(--f-display);font-size:18px;width:34px;height:34px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--accent)}
.step>div{min-width:0}
.step p{margin:2px 0 8px;max-width:68ch}
.tip{font-size:15px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:8px 0 0;max-width:68ch}
.tip b{color:var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;background:color-mix(in srgb,var(--ok) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--ok) 45%,var(--line));border-radius:10px;padding:12px 14px;margin-top:14px}
.check label{cursor:pointer}

/* tick boxes */
.tick{appearance:none;flex:0 0 24px;width:24px;height:24px;border:2px solid var(--muted);border-radius:4px;background:var(--bg);margin:1px 0 0;cursor:pointer;display:grid;place-items:center}
.tick:checked{background:var(--ok);border-color:var(--ok)}
.tick:checked::after{content:"";width:6px;height:12px;border:solid #0d2a1a;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* side quests */
.tiers{display:grid;gap:14px}
.quest{--t:var(--bronze);background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.quest[data-tier="silver"]{--t:var(--silver)} .quest[data-tier="gold"]{--t:var(--gold)} .quest[data-tier="legend"]{--t:var(--legend)}
.quest>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 16px;flex-wrap:wrap}
.quest>summary::-webkit-details-marker{display:none}
.badge{font-family:var(--f-display);font-size:13px;color:var(--bg);background:var(--t);padding:2px 8px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase}
.quest h3{flex:1 1 200px;min-width:0}
.xpv{font-family:var(--f-display);font-size:14px;color:var(--t)}
.done-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.quest.is-done .done-dot{background:var(--ok);border-color:var(--ok)}
.quest .chev{font-family:var(--f-display);color:var(--muted);transition:transform .2s}
.quest[open] .chev{transform:rotate(90deg)}
.qbody{padding:0 16px 16px;border-top:1px solid var(--line)}
.qbody>p{max-width:68ch}
.qbody ol,.qbody ul{padding-left:22px;max-width:68ch}
.qbody li{margin:4px 0}
.brief{background:var(--panel2);border:1px dashed var(--t);border-radius:8px;padding:10px 14px;margin:12px 0}
.brief b{color:var(--t)}

/* workshop */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.filters button{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:5px 14px;font-size:15px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px;align-items:start}

/* MakeCode-style blocks */
.code{background:#0e0d16;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;overflow-x:auto}
.code .cap{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--f-mono)}
.stack{display:inline-flex;flex-direction:column;gap:8px;min-width:max-content}
.blk{--c:#4b7bec;background:var(--c);color:#fff;font-family:var(--f-mono);font-size:14px;border-radius:5px;padding:6px 10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);white-space:nowrap;width:max-content;max-width:none;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.blk.cblk{padding:0;background:transparent;box-shadow:none;border-radius:0}
.cblk>.h{background:var(--c);border-radius:5px 5px 0 0;padding:6px 10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.cblk>.h.hat{border-radius:14px 14px 0 0;padding-top:9px}
.cblk>.in{border-left:14px solid var(--c);padding:6px 0 6px 6px;display:flex;flex-direction:column;gap:4px}
.cblk>.f{background:var(--c);height:12px;width:70px;border-radius:0 0 5px 5px}
.in>.cblk>.f{width:40px}
.slot{background:#fff;color:#2b2b3a;border-radius:10px;padding:0 7px;margin:0 2px;font-weight:500;text-shadow:none;display:inline-block;line-height:1.45}
.rep{--c:#4b7bec;background:var(--c);color:#fff;border:2px solid rgba(255,255,255,.35);border-radius:12px;padding:0 7px;margin:0 2px;display:inline-block;line-height:1.35}
.slot.gapslot{background:transparent;color:#fff;border:2px dashed rgba(255,255,255,.9);font-weight:700;padding:0 8px}
.slot.gapslot i{font-weight:400;opacity:.9}
.gapblk{--c:#4b7bec;border:2px dashed var(--c);background:color-mix(in srgb,var(--c) 16%,#0e0d16);color:var(--ink);font-family:var(--f-body);font-style:italic;font-size:14px;border-radius:5px;padding:6px 10px;width:max-content;min-width:220px;display:flex;align-items:center;gap:8px}
.gapblk .q{font-family:var(--f-display);font-style:normal;font-size:16px;color:var(--c);filter:brightness(1.4)}
.gapblk .drawer{margin-left:auto}
.area{font-family:var(--f-body);text-shadow:none;border:2px dashed var(--accent);border-radius:8px;padding:12px 14px;min-width:280px;max-width:440px;white-space:normal;background:repeating-linear-gradient(135deg,rgba(255,204,51,.06) 0 10px,transparent 10px 20px)}
.area-n{font-family:var(--f-display);color:var(--accent);font-size:16px}
.area-h{font-size:14px;margin:4px 0 8px;color:var(--ink)}
.area-d{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dchip{--c:#4b7bec;background:var(--c);color:#fff;border-radius:4px;padding:1px 7px;font-size:12px}
.hints{margin:12px 0 0;display:grid;gap:6px}
.hints details{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.hints summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:15px}
.hints p{margin:6px 0 0;font-size:15px}
.crit{margin:12px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:8px}
.crit b{font-family:var(--f-display);color:var(--t);font-weight:500}
.crit ul{margin:6px 0 0;padding-left:20px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;margin:4px 0 14px}
.ladder div{--t:var(--bronze);border:1px solid var(--line);border-top:3px solid var(--t);border-radius:8px;padding:8px 12px;background:var(--panel);font-size:14px;color:var(--muted)}
.ladder b{display:block;font-family:var(--f-display);color:var(--t);font-weight:500;font-size:15px}
.drawer{font-size:11px;opacity:.8;margin-left:10px;font-family:var(--f-body);text-transform:uppercase;letter-spacing:.8px}
.note{font-family:var(--f-body);font-size:13px;color:var(--muted);margin:-2px 0 2px 2px;white-space:normal}

/* help */
.bugs{display:grid;gap:10px}
.bug{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.bug b{color:var(--warn)}
.bug p{margin:4px 0 0;max-width:70ch}
.tips{list-style:none;padding:0;margin:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));counter-reset:tip}
.tips .bug>b{color:var(--accent)}
.tips .bug>b::before{counter-increment:tip;content:counter(tip) ". "}
.links{display:grid;gap:10px;margin-top:10px}
.linkrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.linkrow input{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:8px 10px;min-width:0;font-size:16px}
.saveline{color:var(--muted);font-size:14px;margin-top:6px}
.legendkey{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.legendkey .blk{font-size:12px;padding:3px 8px}
.foot{margin-top:40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:560px){.hud{position:static}.step{grid-template-columns:1fr}.linkrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* password locks */
.lockbox{max-width:520px;margin:40px auto;text-align:center;padding:32px 20px;border:1px solid var(--line,rgba(255,255,255,.12));border-radius:16px}
.lockicon{font-size:44px;line-height:1;margin-bottom:8px}
.lockbox .lede{margin-inline:auto}
.lockform{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.lockform input{font:inherit;font-size:20px;letter-spacing:.2em;text-align:center;width:180px;padding:10px 12px;border-radius:10px;border:2px solid var(--line,#555);background:transparent;color:inherit}
.lockform button{font:inherit;font-weight:600;padding:10px 18px;border-radius:10px;border:0;background:var(--accent,#ffcc33);color:#1b1b28;cursor:pointer}
.lockform button:disabled{opacity:.6;cursor:wait}
.lockmsg{min-height:1.4em;margin-top:12px;color:var(--muted)}
.map .lk{font-size:11px}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ===== lesson routine ===== */
html{scroll-padding-top:90px}
.lhead{position:relative}
.hwbtn{float:right;margin:2px 0 10px 16px;font-family:var(--f-display);font-size:17px;color:var(--bg);background:var(--legend);border:0;border-radius:6px;padding:7px 16px;box-shadow:0 4px 0 #b3407a}
.hwbtn:hover{transform:translateY(-1px)}
.hwbtn.done{background:transparent;color:var(--ok);border:2px solid var(--ok);box-shadow:none}
.flow{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-wrap:wrap;counter-reset:fl}
.flow li{counter-increment:fl}
.flow a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-right:0;padding:5px 14px 5px 12px;min-width:112px}
.flow li:first-child a{border-radius:8px 0 0 8px} .flow li:last-child a{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
.flow b{font-family:var(--f-display);font-weight:500;font-size:15px} .flow b::before{content:counter(fl) ". ";color:var(--accent)}
.flow span{font-size:13px;color:var(--muted)}
.flow a:hover{background:var(--panel2);border-color:var(--accent)}
h2 .score{font-family:var(--f-display);font-size:18px;color:var(--bg);background:var(--accent);border-radius:4px;padding:1px 10px}
.mcqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px;margin-top:10px}
.mcq{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative}
.mcq .from{position:absolute;top:-10px;right:12px;font-family:var(--f-display);font-size:12px;background:var(--bg);border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 9px;letter-spacing:.5px}
.mq{margin:0 0 10px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--panel2);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .ol{font-family:var(--f-display);color:var(--accent);flex:0 0 auto}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{opacity:1;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel2))}
.opt.right::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:700}
.opt.wrong{opacity:1;border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel2));text-decoration:line-through;text-decoration-color:var(--warn)}
.why{margin:10px 0 0;font-size:15px;background:var(--panel2);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 6px 6px 0}
.why b{font-family:var(--f-display);color:var(--accent);font-weight:500}
.got-wrong .why b{color:var(--warn)} .got-right .why b{color:var(--ok)}
.mcq code,.predict code,.hwsteps code{font-family:var(--f-mono);font-size:.88em;background:#0e0d16;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:#ffd97a}
.reset{margin-top:8px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:0}
.ready{background:color-mix(in srgb,var(--ok) 10%,var(--panel));border-left:4px solid var(--ok);padding:8px 14px;margin:8px 0 12px;max-width:72ch;border-radius:0 8px 8px 0}
.ready b{font-family:var(--f-display);font-weight:500;color:var(--ok)}
.words{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px}
.words h3{color:var(--accent)}
.words .wl{margin:2px 0 10px;font-size:14px;color:var(--muted)}
.words dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:6px 22px}
.words dt{font-family:var(--f-display);font-size:16px;color:var(--ink)}
.words dd{margin:0 0 6px;font-size:15px;color:var(--muted)}
.predict{border:2px dashed #4b7bec;border-radius:8px;padding:8px 12px;margin:10px 0;max-width:68ch;background:color-mix(in srgb,#4b7bec 10%,var(--panel))}
.predict span{display:inline-block;font-family:var(--f-display);color:#7ea2ff;margin-right:8px}
.hinge{margin:6px 0 4px;padding:12px 14px;border:2px solid #4b7bec;border-radius:12px;background:color-mix(in srgb,#4b7bec 8%,var(--panel))}
.hh{font-family:var(--f-display);font-size:19px;color:#7ea2ff}
.hl{color:var(--muted);margin:2px 0 8px;font-size:15px}
.hinge .mcq{background:var(--panel2)}
.talk{background:var(--panel);border:2px solid var(--accent);border-radius:18px 18px 18px 4px;padding:14px 18px;max-width:780px}
.talk h3{color:var(--accent)}
.talk p{margin:6px 0 10px}
.stems{background:var(--panel2);padding:8px 14px;border-radius:8px}
.stems b{font-family:var(--f-display);font-weight:500;color:var(--accent)}
.stems ul{margin:4px 0 0;padding-left:20px}
.conf{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px}
.crow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.crow:last-child{border-bottom:0}
.cg{font-size:15px}
.cbtns{display:flex;gap:6px}
.cbtns button{border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 12px;font-size:14px;color:var(--ink)}
.cbtns .c0[aria-pressed="true"]{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,var(--panel2))}
.cbtns .c1[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--panel2))}
.cbtns .c2[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--panel2))}
.routine{max-width:72ch;padding-left:22px}.routine li{margin:6px 0}.routine b{color:var(--accent)}
.hwslip{width:min(740px,94vw);max-height:90vh;overflow:auto;border:1px solid var(--line);padding:24px 26px 20px;color:var(--ink);background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.hwslip::backdrop{background:rgba(5,5,12,.7)}
.hwslip h1{font-size:clamp(26px,4vw,34px);margin-top:4px}
.hwslip .eyebrow{color:var(--legend)}
.hwclose{position:absolute;top:12px;right:14px;margin:0}
.hwclose button{background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:16px;color:var(--ink)}
.hwmeta{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;margin:12px 0 4px;color:var(--muted)}
.hwmeta .badge{display:inline-block}
.hwintro{max-width:64ch}
.hwsteps{padding-left:24px;max-width:66ch}.hwsteps>li{margin:8px 0}
.hwflip{background:color-mix(in srgb,var(--ok) 10%,var(--panel2));border-left:4px solid var(--ok);padding:8px 12px;margin:14px 0 0;border-radius:0 8px 8px 0}
.hwflip b{display:block;font-family:var(--f-display);font-weight:500;color:var(--ok)}
.hwhand{font-weight:700;margin:14px 0 0}
@media (max-width:640px){.flow a{min-width:0;padding:4px 8px}.flow span{display:none}.hwbtn{float:none;display:block;margin:0 0 12px}.hwslip{padding:20px 16px}}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}

/* ===== BLOCK COLOURS (match the MakeCode toolbox drawers) ===== */
const CAT={
  // micro:bit
  basic:["#1E90FF","Basic"], input:["#D400D4","Input"], mmusic:["#E63022","Music"], led:["#5C2D91","Led"],
  radio:["#E3008C","Radio"], mloops:["#00AA00","Loops"], mlogic:["#00A4A6","Logic"], mvars:["#DC143C","Variables"], mmath:["#9400D3","Math"],
  // Arcade
  sprites:["#4B7BEC","Sprites"], ctrl:["#D54322","Controller"], game:["#8854D0","Game"], music:["#E30FC0","Music"],
  scene:["#4B6584","Scene"], info:["#CF6A87","Info"], anim:["#03AA74","Character Animations"], loops:["#20BF6B","Loops"],
  logic:["#45AAF2","Logic"], vars:["#FF6680","Variables"], math:["#A55EEA","Math"], fn:["#3455DB","Functions"],
  status:["#FF7F50","Status Bars"], text:["#FFA801","Text"], ext:["#6D6D8A","Extension"]
};
/* ===== tiny block DSL =====
   each line:  "cat|text"   indentation (2 spaces) = inside the block above
   [x] = slot/dropdown   {cat:text} = a round reporter block dropped in a slot
   hat blocks (events) start with "on " or "when " or are "forever"
   "note|text" = grey explanation line                                           */
function inline(t){
  let s=t.replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/\[\?([^\]]*)\]/g,(m,h)=>`<span class="slot gapslot">?${h?` <i>${h}</i>`:""}</span>`)
    .replace(/\[([^\]]*)\]/g,'<span class="slot">$1</span>');
  const re=/\{(\w+):([^{}]*)\}/;
  while(re.test(s)) s=s.replace(re,(m,c,x)=>`<span class="rep" style="--c:${(CAT[c]||CAT.ext)[0]}">${x}</span>`);
  return s;
}
function parse(src){
  const root={kids:[],d:-1},st=[root];
  src.trim().split("\n").forEach(raw=>{
    if(!raw.trim())return;
    const d=raw.match(/^ */)[0].length/2, [c,...r]=raw.trim().split("|"), n={c,t:r.join("|"),d,kids:[]};
    while(st[st.length-1].d>=d)st.pop();
    st[st.length-1].kids.push(n);st.push(n);
  });return root.kids;
}
function rb(n){
  if(n.c==="note")return `<div class="note">${inline(n.t)}</div>`;
  if(n.c==="gap"){const [d,h]=n.t.split("|"),[col,name]=CAT[d]||CAT.ext;
    return `<div class="gapblk" style="--c:${col}"><span class="q">?</span>${inline(h)}<span class="drawer">${name}</span></div>`}
  if(n.c==="area"){const [num,ds,h]=n.t.split("|");
    const chips=ds.split(",").map(d=>{const c=CAT[d.trim()]||CAT.ext;return `<span class="dchip" style="--c:${c[0]}">${c[1]}</span>`}).join("");
    return `<div class="area"><div class="area-n">${num} block${num==="1"?"":"s"} go here</div><div class="area-h">${inline(h)}</div><div class="area-d">Drawers you'll need: ${chips}</div></div>`}
  const [col,name]=CAT[n.c]||CAT.ext, hat=/^(on |when |forever|function )/.test(n.t);
  const dr=`<span class="drawer">${name}</span>`;
  if(n.kids.length||hat){
    return `<div class="blk cblk" style="--c:${col}"><div class="h${hat?" hat":""}">${inline(n.t)}${dr}</div><div class="in">${n.kids.map(rb).join("")||'<div class="note">(empty)</div>'}</div><div class="f"></div></div>`;
  }
  return `<div class="blk" style="--c:${col}">${inline(n.t)}${dr}</div>`;
}
function blocks(src,cap){return `<div class="code">${cap?`<div class="cap">${cap}</div>`:""}<div class="stack">${parse(src).map(rb).join("")}</div></div>`}

const TIPS=[
 ["Say what it should do","Before touching any blocks, say out loud (or to a partner): \"When I press A, it should…, but instead it…\". Being exact about the bug is half the fix."],
 ["Read your code like a computer","Go through your blocks one at a time, in order, and say what each one does. Computers do exactly what you tell them, not what you meant."],
 ["Make the bug happen again","Can you make it happen every time? Does it only happen after jumping, or only on level 2? Knowing <b>when</b> tells you <b>where</b> to look."],
 ["Change one thing, then test","If you change three things at once and it works, you won't know which one fixed it. If it breaks, you won't know which one broke it."],
 ["Look for warning triangles","A yellow or red triangle on a block means something is missing or wrong. Click it to read the message."],
 ["Check the dropdowns","A block can look right but have the wrong sprite, kind or variable chosen. Click each dropdown and check."],

 ["Compare with the handbook","Put your code next to the step in this handbook and check block by block: same blocks, same order, same numbers, same place."],

let S={done:{},name:"",cls:"",links:{},tab:"BRIEF",wcat:"All"};
try{const s=JSON.parse(localStorage.getItem("levelup-v1")||"null");if(s)S=Object.assign(S,s)}catch(e){}
S.mcq=S.mcq||{};S.conf=S.conf||{};
function save(){try{localStorage.setItem("levelup-v1",JSON.stringify(S))}catch(e){}}

function xpOf(key){
  if(key.endsWith(":core"))return XP.core;
  const [lid,idx]=key.split(":q"); const L=LESSONS.find(l=>l.id===lid);
  if(L&&idx!==undefined)return XP[L.quests[+idx].tier];
  const W=WORKSHOP.find(w=>w.id===key); return W?XP[W.tier]:0;
}
function totalXP(){return Object.keys(S.done).filter(k=>S.done[k]).reduce((a,k)=>a+xpOf(k),0)}
function maxXP(){let m=0;LESSONS.forEach(l=>{m+=XP.core;l.quests.forEach(q=>m+=XP[q.tier])});WORKSHOP.forEach(w=>m+=XP[w.tier]);return m}
function hud(){
  const x=totalXP();let r=RANKS[0][1];RANKS.forEach(([t,n])=>{if(x>=t)r=n});
  document.getElementById("xpText").textContent=x+" XP";
  document.getElementById("rank").textContent="Rank: "+r;
  document.getElementById("xpBar").style.width=Math.min(100,x/maxXP()*100)+"%";
}

/* ===== RENDER ===== */
const TIERNAME={bronze:"Bronze",silver:"Silver",gold:"Gold",legend:"Legend"};
const LADDER=`<div class="ladder">
 <div><b>Bronze · Copy &amp; tweak</b>All the blocks are shown. Build it, then change it.</div>
 <div style="--t:var(--silver)"><b>Silver · Fill the gaps</b>Dashed shapes are missing blocks or values. The colour tells you the drawer.</div>
 <div style="--t:var(--gold)"><b>Gold · Finish it</b>You get the start. You write the rest in the yellow box.</div>
 <div style="--t:var(--legend)"><b>Legend · Extra challenge</b>Just the brief. Only once Gold is done. You plan it, build it and test it.</div></div>`;
function questHTML(key,q){
  const d=!!S.done[key];
  return `<details class="quest${d?" is-done":""}" data-tier="${q.tier}">
   <summary><span class="badge">${TIERNAME[q.tier]}</span><h3>${q.title}</h3><span class="xpv">+${XP[q.tier]} XP</span><span class="done-dot" aria-hidden="true"></span><span class="chev" aria-hidden="true">›</span></summary>
   <div class="qbody">${q.body}
    ${q.crit?`<div class="crit"><b>It's done when…</b><ul>${q.crit.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}
    ${q.hints?`<div class="hints">${q.hints.map((h,i)=>`<details><summary>Stuck? Hint ${i+1}</summary><p>${h}</p></details>`).join("")}</div>`:""}
    <div class="check"><input type="checkbox" class="tick" id="t-${key}" data-k="${key}" ${d?"checked":""}><label for="t-${key}">I built this and tested it works.</label></div>
   </div></details>`;
}
function map(){
  const m=document.getElementById("map");
  const tabs=LESSONS.map(l=>[l.id,l.n,l.t]);
  tabs.splice(2,0,"sep");
  tabs.unshift(["BRIEF","Start here","The mission"],"sep");
  tabs.push("sep",["WS","Workshop","All features"],["HELP","Help","Bugs & tips"]);
  m.innerHTML=tabs.map(t=>t==="sep"?'<span class="sep"></span>':`<button role="tab" aria-selected="${S.tab===t[0]}" data-tab="${t[0]}"><span class="n">${t[1]}${isLocked(t[0])?' <span class="lk" aria-label="locked">🔒</span>':''}</span><span class="t">${t[2]}</span></button>`).join("");
}
function lesson(L){
  const ck=L.id+":core",P=L.ped;
  return `<div class="lhead">${L.hw?`<button class="hwbtn${S.done[L.id+":hw"]?" done":""}" data-hw="${L.id}">${hwLabel(L.id)}</button>`:""}<div class="eyebrow">${L.n.toUpperCase()} · ${L.tag.toUpperCase()}</div><h1>${L.t}</h1><p class="lede">${L.lede}</p><div class="goals">${L.goals.map(g=>`<span>${g}</span>`).join("")}</div></div>
   ${P?flowHTML(L):""}
   ${P?doNowHTML(L):""}
   <h2 id="sec-main">Main quest <span class="xpv" style="color:var(--accent)">+${XP.core} XP</span></h2>
   <p class="lede" style="margin-top:0">Follow along with the teacher. Get stuck? Every step is here.${L.basics?` Do one step, press play and check it works before the next one. Mouse giving you trouble? See <a href="#HELP" data-tab="HELP"><b>MakeCode basics</b></a> on the Help tab.`:""}</p>
   <div class="core">${L.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><h3>${s.h}</h3><p>${s.p}</p>${P&&P.predict&&P.predict[i]?`<div class="predict"><span>Predict first</span>${P.predict[i]}</div>`:""}${s.code?blocks(s.code):""}${s.tip?`<p class="tip">${s.tip}</p>`:""}${s.see?`<p class="see"><b>✔ You should see:</b> ${s.see}</p>`:""}</div></div>${P&&P.hinge&&P.hinge.after===i?hingeHTML(L):""}`).join("")}
    <div class="check"><input type="checkbox" class="tick" id="t-${ck}" data-k="${ck}" ${S.done[ck]?"checked":""}><label for="t-${ck}"><b>Checkpoint:</b> ${L.check}</label></div>
   </div>
   ${P?talkHTML(L):""}
   <h2 id="sec-quests">Side quests</h2>
   <p class="lede" style="margin-top:0"><b>In class, finish Bronze, Silver and Gold.</b> Each tier gives you less help. Legend is an extra challenge for when Gold is done.${L.tag==="Arcade"?" Want something else? Try the <b>Workshop</b> tab.":""}</p>
   ${LADDER}
   <div class="tiers">${L.quests.map((q,i)=>questHTML(L.id+":q"+i,q)).join("")}</div>
   ${P?exitHTML(L):""}`;
}

const FLOW=[["Do Now",5,"sec-dn"],["Main quest",20,"sec-main"],["Talk task",5,"sec-talk"],["Bronze → Gold",20,"sec-quests"],["Exit ticket",5,"sec-exit"]];
function flowHTML(L){
  return `<ol class="flow" aria-label="Lesson plan">${FLOW.map(x=>`<li><a href="#${x[2]}" data-jump="${x[2]}"><b>${x[0]}</b><span>~${x[1]} min</span></a></li>`).join("")}</ol>`;
}
function mcqHTML(id,m,n){
  const [q,opts,a,why,from]=m,ch=S.mcq[id],done=ch!==undefined,ok=done&&ch===a;
  return `<div class="mcq${done?(ok?" got-right":" got-wrong"):""}" data-mcq="${id}" data-n="${n||""}">${from?`<span class="from">${from}</span>`:""}
   <p class="mq">${n?`<b>${n}.</b> `:""}${q}</p>
   <div class="opts">${opts.map((o,i)=>`<button class="opt${done&&i===a?" right":""}${done&&i===ch&&i!==a?" wrong":""}" data-opt="${i}" ${done?"disabled":""}><span class="ol">${"ABCD"[i]}</span><span>${o}</span></button>`).join("")}</div>
   ${done?`<p class="why"><b>${ok?"Correct!":"Not quite."}</b> ${why}</p>`:""}</div>`;
}
function findMcq(id){
  const [lid,kind,n]=id.split(":"),L=LESSONS.find(l=>l.id===lid);if(!L||!L.ped)return null;
  return kind==="dn"?L.ped.doNow[+n]:kind==="ex"?L.ped.exit[+n]:kind==="hg"?L.ped.hinge.q:null;
}
function scoreHTML(L,kind){
  const arr=kind==="dn"?L.ped.doNow:L.ped.exit;let got=0;
  arr.forEach((m,i)=>{if(S.mcq[`${L.id}:${kind}:${i}`]===m[2])got++});
  return `<span class="score" data-score="${L.id}:${kind}">${got} / ${arr.length}</span>`;
}
function prevFlip(L){const i=LESSONS.indexOf(L);const p=i>0?LESSONS[i-1]:null;return p&&p.ped&&p.ped.flip?p.ped.flip.replace(/^Before [^:]+:\s*/,""):""}
function doNowHTML(L){
  const P=L.ped,ready=prevFlip(L);
  return `<h2 id="sec-dn">Do Now ${scoreHTML(L,"dn")}</h2>
   <p class="lede" style="margin-top:0">On your own, in silence, as soon as you sit down. These come from earlier lessons, so you don't forget them.</p>
   ${ready?`<div class="ready"><b>Flip check:</b> before this lesson you were asked to: ${ready} <i>Share it with your partner in 30 seconds.</i></div>`:""}
   <div class="mcqs">${P.doNow.map((m,i)=>mcqHTML(`${L.id}:dn:${i}`,m,i+1)).join("")}</div>
   <button class="reset" data-reset="${L.id}:dn">Reset Do Now</button>
   <div class="words"><h3>Key words</h3><p class="wl">Use at least two of these when you talk today.</p><dl>${P.words.map(w=>`<div><dt>${w[0]}</dt><dd>${w[1]}</dd></div>`).join("")}</dl></div>`;
}
function hingeHTML(L){
  return `<div class="hinge"><div class="hh">Check before you carry on</div><p class="hl">Everyone answers. Show your teacher your answer when asked.</p>${mcqHTML(L.id+":hg:0",L.ped.hinge.q)}</div>`;
}
function talkHTML(L){
  const t=L.ped.talk;
  return `<h2 id="sec-talk">Talk task</h2><div class="talk"><h3>${t.h}</h3><p>${t.p}</p><div class="stems"><b>Sentence starters</b><ul>${t.stems.map(s=>`<li>${s}</li>`).join("")}</ul></div></div>`;
}
const CONF_LBL=["Not yet","Getting there","Got it"];
function exitHTML(L){
  const P=L.ped;
  return `<h2 id="sec-exit">Exit ticket ${scoreHTML(L,"ex")}</h2>
   <p class="lede" style="margin-top:0">Last 5 minutes, on your own. Be honest: this tells your teacher what to go over next time.</p>
   <div class="mcqs">${P.exit.map((m,i)=>mcqHTML(`${L.id}:ex:${i}`,m,i+1)).join("")}</div>
   <div class="conf"><h3>How confident are you?</h3>${L.goals.map((g,i)=>{const k=L.id+":"+i,v=S.conf[k];
     return `<div class="crow"><span class="cg">${g}</span><span class="cbtns" role="group">${CONF_LBL.map((c,j)=>`<button data-conf="${k}" data-v="${j}" aria-pressed="${v===j}" class="c${j}">${c}</button>`).join("")}</span></div>`}).join("")}</div>
   <div class="exsend" data-exbox="${L.id}">${exitSendHTML(L)}</div>
   <button class="reset" data-reset="${L.id}:ex">Reset exit ticket</button>`;
}
function exitSendHTML(L){
  const n=L.ped.exit.length,got=L.ped.exit.filter((m,i)=>S.mcq[`${L.id}:ex:${i}`]!==undefined).length,sent=S.done[L.id+":exsent"];
  const st="margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap";
  const b=`font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:#1b1b28`;
  if(sent){
    const wait=Math.ceil((60000-(Date.now()-(S.done[L.id+":exsentAt"]||0)))/1000);
    if(wait>0){clearTimeout(window["exT"+L.id]);window["exT"+L.id]=setTimeout(()=>{const bx=document.querySelector(`[data-exbox="${L.id}"]`);if(bx)bx.innerHTML=exitSendHTML(L)},wait*1000+50);}
    return `<div style="${st}"><b>✓ Sent to your teacher.</b>${wait>0?`<span style="font-size:14px;opacity:.8">Changed your confidence? You can send again in a minute.</span>`:`<button data-exsend="${L.id}" style="${b};opacity:.85">Send again</button><span style="font-size:14px;opacity:.8">Only if you've changed your confidence.</span>`}</div>`;
  }
  return `<div style="${st}"><button data-exsend="${L.id}" style="${b}" ${got<n?"disabled":""}>Send to my teacher</button><span style="font-size:14px;opacity:.85">${got<n?`Answer all ${n} questions first (${got}/${n} done).`:"Your answers and confidence go to your teacher without your name."}</span></div>`;
}
const TIERN={bronze:"Bronze",silver:"Silver",gold:"Gold",legend:"Legend"};

function pop(n){if(window.confetti)confetti({particleCount:n,spread:60,origin:{y:.7},colors:["#ffcc33","#3ddc84","#ff6fb0","#4b7bec"],disableForReducedMotion:true,useWorker:false})}
document.addEventListener("click",e=>{
  const op=e.target.closest("[data-opt]");if(op){const box=op.closest("[data-mcq]"),id=box.dataset.mcq,m=findMcq(id);if(!m||S.mcq[id]!==undefined)return;
    S.mcq[id]=+op.dataset.opt;save();{const bx=document.querySelector(`[data-exbox="${id.split(":")[0]}"]`);const LL=LESSONS.find(l=>l.id===id.split(":")[0]);if(bx&&LL&&id.split(":")[1]==="ex")setTimeout(()=>{bx.innerHTML=exitSendHTML(LL)},0);}if(window.Abity)Abity.answer("levelup",id,S.mcq[id]);box.outerHTML=mcqHTML(id,m,box.dataset.n?+box.dataset.n:0);
    const [lid,kind]=id.split(":"),L=LESSONS.find(l=>l.id===lid),sc=document.querySelector(`[data-score="${lid}:${kind}"]`);if(sc)sc.outerHTML=scoreHTML(L,kind);
    if(S.mcq[id]===m[2])pop(30);return}
  const cf=e.target.closest("[data-conf]");if(cf){S.conf[cf.dataset.conf]=+cf.dataset.v;save();cf.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===cf));return}
  const xs=e.target.closest("[data-exsend]");if(xs){const lid=xs.dataset.exsend,LL=LESSONS.find(l=>l.id===lid);if(!LL)return;
    const lv=LL.goals.map((g,i)=>{const v=S.conf[lid+":"+i];return v===undefined?-1:v});xs.disabled=true;xs.textContent="Sending…";
    Abity.confidence("levelup",lid,lv).then(r=>{if(!r.ok)throw 0;S.done[lid+":exsent"]=true;S.done[lid+":exsentAt"]=Date.now();save();const bx=document.querySelector(`[data-exbox="${lid}"]`);if(bx)bx.innerHTML=exitSendHTML(LL);})
      .catch(()=>{xs.disabled=false;xs.textContent="Try again";});return}
  const rs=e.target.closest("[data-reset]");if(rs){const p=rs.dataset.reset+":";if(/:ex$/.test(rs.dataset.reset))delete S.done[rs.dataset.reset.split(":")[0]+":exsent"];Object.keys(S.mcq).forEach(k=>{if(k.startsWith(p))delete S.mcq[k]});save();const y=scrollY;render();scrollTo(0,y);return}
  const jp=e.target.closest("[data-jump]");if(jp){e.preventDefault();const el=document.getElementById(jp.dataset.jump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  const hb=e.target.closest("[data-hw]");if(hb){const L=LESSONS.find(l=>l.id===hb.dataset.hw);const d=document.getElementById("hwDlg");d.innerHTML=hwHTML(L);d.showModal();d.scrollTop=0;return}
  if(e.target.id==="hwDlg")e.target.close();
});
document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.k;
  if(k&&k.endsWith(":hw")){const id=k.split(":")[0],b=document.querySelector(`[data-hw="${id}"]`);if(b){b.textContent=e.target.checked?"📝 Homework ✓ handed in":"📝 Homework";b.classList.toggle("done",e.target.checked)}}
});

/* ===== LESSON SWITCHES (set by the teacher in admin, per learning group) ===== */
const GATE={ready:false,open:new Set(),err:false,bad:new Set()};
function vaultLocked(id){return id==="WS"?WS_LOCKED:!!(LESSONS.find(l=>l.id===id)||{}).locked}
function isLocked(id){if(id==="BRIEF"||id==="HELP")return false;return !GATE.open.has(id)||vaultLocked(id)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openVault(id,pw){
  const v=VAULT[id];if(!v)return false;
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(v.s),iterations:KDF_ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const data=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(v.i)},key,unb64(v.c))));
    if(id==="WS"){WORKSHOP=data;WS_LOCKED=false}
    else{const i=LESSONS.findIndex(l=>l.id===id);LESSONS[i]=data}
    return true;
  }catch(e){return false}
}
function lockScreen(id){
  const L=LESSONS.find(l=>l.id===id), name=id==="WS"?"Workshop":L.n+": "+L.t;
  const msg=GATE.err?"We can't reach the server right now. Check your internet connection, then refresh the page."
    :!GATE.ready?"Checking which lessons are open…"
    :GATE.bad.has(id)?"This lesson is switched on but didn't open on this device. Refresh the page, and tell your teacher if it still won't open."
    :"Your teacher will switch this on when it's time.";
  return `<div class="lockbox"><div class="lockicon" aria-hidden="true">🔒</div><div class="eyebrow">${GATE.ready&&!GATE.err?"NOT OPEN YET":"PLEASE WAIT"}</div><h1>${name}</h1>
   <p class="lede">${msg}</p></div>`;
}
async function autoUnlock(){
  let st;
  try{st=await Abity.state()}catch(e){GATE.err=true;GATE.ready=true;render();return}
  if(!st){location.replace("/?next="+encodeURIComponent(location.pathname+location.hash));return}
  const it=(st.items||[]).find(i=>i.item==="levelup");
  if(!it){location.replace("/group");return}
  for(const l of it.lessons){
    if(!l.open)continue;
    GATE.open.add(l.lesson);
    if(vaultLocked(l.lesson)&&!(l.key&&window.crypto&&crypto.subtle&&await openVault(l.lesson,l.key)))GATE.bad.add(l.lesson);
  }
  GATE.ready=true;
  const back=document.getElementById("backlink");if(back)back.textContent="← "+st.year+st.group;
  const nm=document.getElementById("stuName"),cl=document.getElementById("stuClass");
  if(nm&&st.name){S.name=st.name;nm.value=st.name}
  if(cl){S.cls=st.year+st.group;cl.value=S.cls}
  save();render();
}
function render(){
  map();const v=document.getElementById("view");
  const L=LESSONS.find(l=>l.id===S.tab);
  v.innerHTML=isLocked(S.tab)?lockScreen(S.tab):L?lesson(L):S.tab==="WS"?workshop():S.tab==="BRIEF"?brief():help();
  const pw=document.getElementById("pw");if(pw)pw.focus({preventScroll:true});
  hud();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;save();render();window.scrollTo({top:0,behavior:"smooth"});return}
  const c=e.target.closest("[data-wcat]");if(c){S.wcat=c.dataset.wcat;save();render()}
});
document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.k;
  if(k){S.done[k]=e.target.checked;save();hud();const q=e.target.closest(".quest");if(q)q.classList.toggle("is-done",e.target.checked);
    if(e.target.checked&&window.confetti)confetti({particleCount:70,spread:65,origin:{y:.7},colors:["#ffcc33","#3ddc84","#ff6fb0","#4b7bec"],disableForReducedMotion:true,useWorker:false});}
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.link){S.links[e.target.dataset.link]=e.target.value;save()}
  if(e.target.id==="stuName"){S.name=e.target.value;save()}
  if(e.target.id==="stuClass"){S.cls=e.target.value;save()}
});
document.getElementById("stuName").value=S.name;document.getElementById("stuClass").value=S.cls;
if(/^#(BRIEF|L[1-7]|WS|HELP)$/.test(location.hash))S.tab=location.hash.slice(1);
render();
autoUnlock();

</script>
