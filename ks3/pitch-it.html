<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.png">
<title>Pitch It Handbook</title>
<link rel="stylesheet" href="/ks3/fonts.css">
<style>
/* Exercise-book look: ruled paper, red margin, blue-ink text, sticky-note tips, red-pen ticks. */
:root{
  --paper:#fffdf5; --rule:#cfe0f1; --margin:#ef9a9a; --ink:#1d2d6e; --ink-soft:#4f5d93; --pencil:#6d7088;
  --red:#c62828; --hl:#fff176; --card:#fff; --line:#d8dbe8; --sticky:#fff4a3;
  --word:#185abd; --excel:#107c41; --ppt:#c43e1c;
  --bronze:#a3622b; --silver:#66758c; --gold:#b07d00; --legend:#b0307a;
  --f-hand:"Caveat", "Segoe Print", cursive;
  --f-print:"Patrick Hand", "Segoe Print", cursive;
  --f-body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  --lh:32px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-color:var(--paper);
  background-image:linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));
  background-size:100% var(--lh);}
a{color:var(--word)}
button,input{font:inherit}
button{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--word);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.88em;background:#eef2fb;border:1px solid #d5ddf0;border-radius:4px;padding:1px 6px;color:#14245c;white-space:nowrap}
kbd{font-family:var(--f-body);font-size:.85em;background:#fff;border:1px solid #b9bfd3;border-bottom-width:3px;border-radius:5px;padding:0 6px;color:var(--ink);white-space:nowrap}

/* page with red margin line */
.wrap{max-width:1000px;margin:0 auto;padding:0 18px 64px 64px;position:relative}
.wrap::before{content:"";position:absolute;top:0;bottom:0;left:40px;border-left:2px solid var(--margin);box-shadow:4px 0 0 -1px var(--margin)}
@media (min-width:1100px){
  body{background-image:radial-gradient(circle at 34px 50%,#e7e1cf 0 10px,#d6cfba 10.5px,transparent 11.5px),linear-gradient(to bottom,transparent calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px),var(--rule) var(--lh));
    background-size:68px 240px,100% var(--lh);background-repeat:repeat-y,repeat;background-attachment:fixed,scroll}
}

/* HUD: like the label on the front of an exercise book */
.hud{position:sticky;top:0;z-index:20;background:#f4efe0;border-bottom:2px solid #e2d8bd;box-shadow:0 2px 8px rgba(40,40,80,.08)}
.hud-in{max-width:1000px;margin:0 auto;padding:10px 18px 10px 64px;display:flex;gap:10px 40px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--f-hand);font-weight:700;font-size:34px;line-height:1;color:var(--red);white-space:nowrap;transform:rotate(-2deg)}
.brand small{display:block;font-family:var(--f-print);font-size:14px;color:var(--ink-soft);transform:rotate(2deg);margin-top:2px}
.who{display:flex;gap:6px 14px;flex-wrap:wrap;flex:1 1 320px}
.who label{display:flex;align-items:baseline;gap:6px;font-family:var(--f-print);font-size:16px;color:var(--ink-soft);flex:1 1 130px;min-width:0}
.who input{border:0;border-bottom:2px dotted var(--ink-soft);background:transparent;color:var(--ink);font-family:var(--f-hand);font-size:24px;font-weight:600;padding:0 4px;min-width:0;width:100%;line-height:1.1}
.who input:focus{outline:none;border-bottom-color:var(--word);border-bottom-style:solid}
.xp{flex:0 1 340px;min-width:200px}
.xp-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-print);font-size:16px}
.xp-top #rank{color:var(--ink);font-size:18px} .xp-top b{font-family:var(--f-hand);font-size:24px;color:var(--red)}
.bar{height:14px;border-bottom:2px solid var(--ink);position:relative;margin-top:1px}
.bar i{position:absolute;left:0;bottom:1px;height:13px;width:0;background:var(--hl);opacity:.95;border-radius:3px 7px 4px 6px;transform:skewX(-8deg);transition:width .4s;box-shadow:inset 0 -3px 0 rgba(230,200,0,.4)}

/* tabs: notebook dividers */
.map{display:flex;flex-wrap:wrap;row-gap:10px;gap:6px;padding:22px 2px 0;scrollbar-width:thin;align-items:flex-end;border-bottom:2px solid var(--ink)}
.map button{--a:var(--ink-soft);flex:0 0 auto;background:#f6f3ea;border:1.5px solid #c9c4b3;border-bottom:0;border-top:5px solid var(--a);color:var(--ink);border-radius:8px 8px 0 0;padding:6px 12px 6px;text-align:left;min-width:92px}
.map button[data-app="w"]{--a:var(--word)} .map button[data-app="x"]{--a:var(--excel)} .map button[data-app="p"]{--a:var(--ppt)} .map button[data-app="s"]{--a:var(--red)}
.map button .n{font-family:var(--f-print);font-size:14px;display:block;color:var(--a)}
.map button .t{font-family:var(--f-print);font-size:17px;line-height:1.15}
.map button[aria-selected="true"]{background:#fff;padding-bottom:10px;border-color:var(--ink);position:relative;top:2px}
.map .sep{flex:0 0 6px}

/* lesson head */
.lhead{padding:26px 0 6px}
.eyebrow{font-family:var(--f-print);color:var(--red);font-size:17px;letter-spacing:.5px}
h1,h2{font-family:var(--f-hand);font-weight:700;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,7vw,58px);display:inline;background:linear-gradient(transparent 70%,rgba(255,241,118,.85) 70%);padding:0 4px}
h2{font-size:38px;margin:36px 0 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2 .xpv{font-family:var(--f-print);font-size:18px;color:var(--red)}
h3{font-family:var(--f-print);font-weight:400;font-size:23px;margin:0;line-height:1.25}
.lede{color:var(--ink-soft);max-width:66ch;margin:10px 0 0}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.goals span{font-size:15px;border:1.5px solid var(--ink-soft);border-radius:999px 999px 999px 999px/60% 40% 60% 40%;padding:2px 12px;background:var(--paper)}

/* main task card, taped to the page */
.core{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:10px 20px 18px;margin-top:6px;box-shadow:0 2px 0 #ece8dc,0 6px 16px rgba(30,40,90,.08);position:relative}
.core::before,.lockbox::before{content:"";position:absolute;top:-12px;left:50%;width:110px;height:24px;transform:translateX(-50%) rotate(-2deg);background:rgba(232,220,180,.75);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.step{display:grid;grid-template-columns:42px 1fr;gap:12px;padding:16px 0;border-bottom:1.5px dashed var(--line)}
.step:last-of-type{border-bottom:0}
.step .num{font-family:var(--f-hand);font-weight:700;font-size:26px;width:40px;height:40px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:52% 48% 45% 55%/55% 45% 55% 45%;color:var(--ink)}
.step>div{min-width:0}
.step p{margin:4px 0 8px;max-width:70ch}
.step ol{margin:6px 0;padding-left:22px}
.tip{font-size:15.5px;background:var(--sticky);padding:10px 14px;margin:10px 0 2px;max-width:68ch;box-shadow:0 3px 6px rgba(0,0,0,.08);border-radius:2px 2px 14px 2px;position:relative}
.tip::before{content:"Tip";font-family:var(--f-hand);font-weight:700;font-size:20px;color:var(--red);margin-right:6px}
.guess{display:inline-flex;align-items:baseline;gap:2px;margin-left:4px;font-weight:700}
.guess input{width:80px;border:0;border-bottom:2px solid var(--red);background:transparent;font-family:var(--f-hand);font-size:24px;color:var(--red);padding:0 4px}
[data-fill]{background:linear-gradient(transparent 55%,rgba(255,241,118,.9) 55%)}

/* checkpoint + tick boxes */
.check{display:flex;gap:14px;align-items:flex-start;border:2px dashed var(--red);border-radius:6px;padding:12px 14px;margin-top:14px;background:#fff8f7}
.check label{cursor:pointer}
.check b{font-family:var(--f-hand);font-size:22px;color:var(--red)}
.tick{appearance:none;flex:0 0 28px;width:28px;height:28px;border:2px solid var(--ink);border-radius:3px;background:#fff;margin:0;cursor:pointer;position:relative}
.tick:checked::after{content:"✓";position:absolute;left:1px;top:-20px;font-family:var(--f-hand);font-weight:700;font-size:46px;line-height:1;color:var(--red);transform:rotate(-6deg)}

/* side quests */
.tiers{display:grid;gap:14px}
.quest{--t:var(--bronze);background:var(--card);border:1px solid var(--line);border-left:6px solid var(--t);border-radius:3px;box-shadow:0 3px 10px rgba(30,40,90,.06)}
.quest[data-tier="silver"]{--t:var(--silver)} .quest[data-tier="gold"]{--t:var(--gold)} .quest[data-tier="legend"]{--t:var(--legend)}
.quest>summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.quest>summary::-webkit-details-marker{display:none}
.badge{font-family:var(--f-print);font-size:15px;color:#fff;background:var(--t);padding:1px 10px;border-radius:999px;transform:rotate(-3deg);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.quest h3{flex:1 1 200px;min-width:0}
.xpv{font-family:var(--f-print);font-size:16px;color:var(--t)}
.done-dot{width:18px;height:18px;border:2px solid var(--line);border-radius:3px;position:relative}
.quest.is-done .done-dot{border-color:var(--ink)}
.quest.is-done .done-dot::after{content:"✓";position:absolute;left:0;top:-14px;font-family:var(--f-hand);font-weight:700;font-size:30px;color:var(--red)}
.quest .chev{font-family:var(--f-print);font-size:22px;color:var(--ink-soft);transition:transform .2s}
.quest[open] .chev{transform:rotate(90deg)}
.qbody{padding:2px 16px 16px;border-top:1.5px dashed var(--line)}
.qbody>p{max-width:70ch}
.qbody ol,.qbody ul{padding-left:22px;max-width:70ch}
.qbody li{margin:6px 0}
.brief{background:#fdfbff;border:2px dashed var(--t);border-radius:6px;padding:12px 14px;margin:12px 0}
.brief b{color:var(--t)}
.hints{margin:12px 0 0;display:grid;gap:6px}
.hints details,.ans{background:#f5f7fc;border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.hints summary,.ans summary{cursor:pointer;color:var(--word);font-weight:700;font-size:15px}
.hints p{margin:6px 0 0;font-size:15.5px}
.ans{margin-top:10px;max-width:68ch} .ans ol{margin:6px 0 0}
.crit{margin:12px 0 0;padding:10px 14px;border:1.5px solid var(--line);border-radius:6px;background:#fff}
.crit b{font-family:var(--f-hand);font-size:22px;color:var(--t)}
.crit ul{margin:4px 0 0;padding-left:20px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px;margin:6px 0 16px}
.ladder div{--t:var(--bronze);border:1px solid var(--line);border-top:5px solid var(--t);border-radius:3px;padding:8px 12px;background:#fff;font-size:15px;color:var(--ink-soft)}
.ladder b{display:block;font-family:var(--f-print);color:var(--t);font-weight:400;font-size:18px}
.area{border:2px dashed var(--gold);border-radius:6px;padding:12px 14px;margin:12px 0;background:repeating-linear-gradient(135deg,rgba(255,241,118,.25) 0 10px,transparent 10px 20px)}
.area-n{font-family:var(--f-hand);font-weight:700;font-size:22px;color:var(--gold)}
.area-h{margin:2px 0 6px}
.area-d{font-size:14px;color:var(--ink-soft)}

/* ribbon path chips */
.rib{--a:var(--word);display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px 4px;background:#f3f4f8;border:1px solid #c8cbd8;border-radius:6px;padding:1px 8px 1px 2px;font-size:14.5px;line-height:1.5;vertical-align:baseline;color:#202437;margin:1px 0}
.rib-x{--a:var(--excel)} .rib-p{--a:var(--ppt)}
.rib .ico{background:var(--a);color:#fff;font-weight:700;font-size:12px;width:20px;height:20px;border-radius:4px;display:inline-grid;place-items:center;margin-right:3px}
.rib .sep{color:#8a8fa6}
.rib .seg:last-child{font-weight:700}
.seg.gap{border:2px dashed var(--red);border-radius:5px;padding:0 6px;color:var(--red);font-weight:700;background:#fff;display:inline-block;line-height:1.35}
.seg.gap i{font-weight:400}

/* Excel mock */
.xlwrap{margin:12px 0;max-width:100%}
.cap{font-family:var(--f-print);font-size:16px;color:var(--ink-soft);margin-bottom:4px}
.fxbar{display:flex;align-items:center;gap:0;border:1px solid #c6c6c6;border-bottom:0;background:#fff;font-family:"Segoe UI",Arial,sans-serif;font-size:14px;max-width:max-content;min-width:min(100%,380px)}
.fxbar .nm{padding:3px 10px;border-right:1px solid #c6c6c6;min-width:56px;color:#222}
.fxbar .fx{padding:3px 10px;font-style:italic;color:#777;border-right:1px solid #c6c6c6;font-family:Georgia,serif}
.fxbar .fv{padding:3px 10px;font-family:var(--f-mono);font-size:13.5px;color:#111;flex:1}
.xlscroll{overflow-x:auto}
table.xl{border-collapse:collapse;background:#fff;font-family:"Segoe UI",Calibri,Arial,sans-serif;font-size:14px;color:#111}
.xl th{background:#f3f3f3;color:#555;font-weight:400;border:1px solid #d4d4d4;padding:2px 8px;min-width:28px;font-size:12.5px}
.xl td{border:1px solid #e1e1e1;padding:3px 9px;min-width:84px;white-space:nowrap;height:28px}
.xl td.rt{text-align:right}
.xl td.hd{font-weight:700}
.xl td.in{background:#ffcc99;color:#3f3f76;border:1px solid #7f7f7f}
.xl td.calc{background:#f2f2f2;color:#fa7d00;font-weight:700;border:1px solid #7f7f7f}
.xl td.out{background:#f2f2f2;color:#3f3f3f;font-weight:700;border:2px solid #3f3f3f}
.xl td.sel{outline:2.5px solid var(--excel);outline-offset:-2px}
.xl td.gapc{border:2px dashed var(--red);color:var(--red);text-align:left}
.xl td.gapc .q{font-weight:700} .xl td.gapc i{font-size:12.5px}
.xl .f{font-family:var(--f-mono);font-size:12.5px;color:#0f5132}
.xl td.calc .f,.xl td.out .f{color:inherit}
.xl .res{display:block;font-size:12px;color:#777;font-weight:400}

/* Word mocks */
.docmock{margin:12px 0}
.page{background:#fff;border:1px solid #d4d6de;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:16px 22px;max-width:560px;font-family:Aptos,Calibri,"Segoe UI",sans-serif;color:#222}
.dl{display:flex;gap:10px;align-items:baseline;padding:2px 0}
.stag{flex:0 0 74px;font-family:var(--f-body);font-size:11px;color:#777;border:1px solid #ddd;border-radius:3px;text-align:center;background:#fafafa}
.dl-t .dt{font-size:28px;font-family:Aptos Display,Calibri Light,"Segoe UI",sans-serif;letter-spacing:-.3px}
.dl-h1 .dt{font-size:19px;color:#0f4761;margin-top:6px}
.dl-n .dt{font-size:14px}
.dl-b .dt{font-size:14px} .dl-b .dt::before{content:"•  "}
.dl-tb .dt{font-size:13px;border:1px solid #9cb3d9;padding:1px 8px;background:#dbe6f7}
.dl-hd .dt{font-size:12px;color:#888;border-bottom:1px dashed #ccc;width:100%}
table.wt{border-collapse:collapse;background:#fff;font-family:Aptos,Calibri,sans-serif;font-size:14px;margin:10px 0;color:#222}
.wt th{background:#156082;color:#fff;text-align:left;padding:4px 14px}
.wt td{border-bottom:1px solid #9cc2e5;padding:4px 14px}
.wt tr:nth-child(even) td{background:#dceaf7}
.wraps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.wd{margin:0}
.mini{background:#fff;border:1px solid #d4d6de;height:120px;padding:10px;position:relative;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.mini i{display:block;height:5px;background:#b9bfd3;border-radius:2px;flex:0 0 5px}
.mini b{display:block;background:#7fb0e8;border:2px solid var(--word);width:52px;height:38px;flex:0 0 38px}
.wd-square .mini b{position:absolute;right:10px;top:26px} .wd-square .mini i:nth-of-type(n+3):nth-of-type(-n+6){margin-right:66px}
.wd-front .mini b{position:absolute;left:44px;top:38px;opacity:.9}
.wd figcaption{font-size:14px;margin-top:4px} .wd figcaption b{display:block;font-family:var(--f-print);font-size:17px;font-weight:400}

/* PowerPoint mocks */
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.sl16{aspect-ratio:16/9;background:#fff;border:1px solid #d4d6de;box-shadow:0 3px 8px rgba(0,0,0,.08);padding:8px 10px;display:flex;flex-direction:column;gap:5px;border-top:4px solid var(--ppt)}
.sl16 b{font-family:Aptos,Calibri,sans-serif;font-size:14px;color:#222}
.sl16 i{display:block;height:4px;width:70%;background:#c8ccd9;border-radius:2px}
.slvis{font-size:12px;color:#777;border:1px dashed #ccc;padding:2px 6px;margin-top:auto;font-family:var(--f-body)}
.sln{display:block;font-family:var(--f-print);font-size:16px;margin-top:4px}
.bigrule{background:var(--sticky);padding:14px 18px;margin:12px 0;max-width:560px;box-shadow:0 3px 8px rgba(0,0,0,.1);transform:rotate(-.6deg)}
.bigrule div{font-family:var(--f-hand);font-weight:700;font-size:34px;line-height:1.1}
.bigrule small{display:block;font-size:15px;color:var(--ink-soft);margin-top:4px}
svg.hill{width:100%;max-width:580px;background:#fff;border:1px solid #d4d6de;margin:12px 0;display:block}
.hill text{font-family:"Segoe UI",Arial,sans-serif;font-size:12px;fill:#555}
.hill .lab{font-size:13px;fill:#333}
.hill .gl{stroke:#e6e6e6} .hill .ax{stroke:#999}
.hill .pl{fill:none;stroke:#2f6db5;stroke-width:2.5;stroke-linejoin:round}
.hill .pt{fill:#2f6db5}
.hill .ring{fill:none;stroke:var(--red);stroke-width:2.5}
.hill .note{font-family:var(--f-hand);font-size:22px;font-weight:700;fill:var(--red)}
table.crittable,table.keys{border-collapse:collapse;background:#fff;margin:12px 0;max-width:640px;width:100%}
.crittable th,.crittable td,.keys th,.keys td{border:1.5px solid var(--line);padding:6px 12px;text-align:left;vertical-align:top}
.crittable th,.keys th{font-family:var(--f-print);font-weight:400;font-size:18px;white-space:nowrap}
.crittable .sc{font-family:var(--f-hand);font-size:24px;color:var(--red);width:60px;text-align:center}

/* brief page */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:22px}
.pc{--a:var(--word);background:#fff;border:1px solid var(--line);border-top:6px solid var(--a);border-radius:3px;padding:12px 16px;box-shadow:0 3px 10px rgba(30,40,90,.06)}
.pc-x{--a:var(--excel)} .pc-p{--a:var(--ppt)}
.pc b{font-family:var(--f-hand);font-size:32px;color:var(--a);display:block;line-height:1}
.pc span{font-family:var(--f-print);color:var(--ink-soft)}
.pc p{margin:6px 0 0}

/* workshop */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.filters button{background:#fff;border:1.5px solid var(--ink-soft);color:var(--ink);border-radius:999px;padding:3px 14px;font-family:var(--f-print);font-size:17px}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:14px;align-items:start}

/* help */
.bugs{display:grid;gap:10px}
.bug{background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 16px}
.bug b{color:var(--red)}
.bug p{margin:4px 0 0;max-width:72ch}
.tips{list-style:none;padding:0;margin:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));counter-reset:tip}
.tips .bug{background:var(--sticky);border:0;box-shadow:0 3px 6px rgba(0,0,0,.08)}
.tips .bug>b{color:var(--ink);font-family:var(--f-print);font-weight:400;font-size:19px}
.tips .bug>b::before{counter-increment:tip;content:counter(tip) ". "}
.saveline{color:var(--ink-soft);font-size:15px;margin-top:6px}
.foot{margin-top:44px;color:var(--ink-soft);font-family:var(--f-print);font-size:17px;border-top:2px solid var(--ink);padding-top:12px}

/* password lock: an envelope note */
.lockbox{max-width:520px;margin:46px auto;text-align:center;padding:30px 22px;background:#fff;border:1px solid var(--line);border-radius:3px;box-shadow:0 6px 18px rgba(30,40,90,.1);position:relative}
.lockicon{font-size:44px;line-height:1;margin-bottom:6px}

<script>
const XP={core:50,bronze:20,silver:40,gold:70,legend:120};
let LESSONS=[{"id":"L1","n":"Lesson 1","t":"Start your company","tag":"Word","app":"w","lede":"Every business starts with an idea. Today you invent your company and write its fact sheet in Word, using <b>styles</b> so it looks professional and is quick to change.","goals":["<b>Styles</b> → headings that match","<b>Table</b> → rows and columns","<b>Header</b> → text on every page"],"steps":[{"h":"Pick your product","p":"<p>You're going to run a stall at the summer fair. Choose something you could make or buy, and sell, for <b>under £3</b>: cookies, keyrings, slime, bracelets, lemonade… Then think of a company name.</p>","tip":"Simple ideas win. Think about what always sells out at cake sales."},{"h":"Open Word and save straight away","p":"<p>Open the <b>Word</b> app → <b>Blank document</b>. Then go to <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">File</span><span class=\"sep\">›</span><span class=\"seg\">Save As</span><span class=\"sep\">›</span><span class=\"seg\">OneDrive</span></span> and call it <i>Pitch It – Fact Sheet</i>.</p>","tip":"Once it's in OneDrive, <b>AutoSave</b> switches on (top left). Your work saves itself every few seconds.","see":"Your file name at the top of the window, and <b>AutoSave</b> switched on in the top-left corner."},{"h":"Add a title","p":"<p>Type your company name on the first line. Click on it, then click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Home</span><span class=\"sep\">›</span><span class=\"seg\">Styles</span><span class=\"sep\">›</span><span class=\"seg\">Title</span></span>.</p>","see":"Your company name in big Title writing."},{"h":"Add four headings","p":"<p>Press <kbd>Enter</kbd> and type these four headings, each on its own line:</p><p><b>About us · Our product · Who will buy it · Price list</b></p><p>Click on each heading in turn, then click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Home</span><span class=\"sep\">›</span><span class=\"seg\">Styles</span><span class=\"sep\">›</span><span class=\"seg\">Heading 1</span></span>.</p>","tip":"Styles tell Word which lines are headings. That's how the Navigation Pane finds them, and later you can restyle every heading in one go.","see":"Click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">View</span><span class=\"sep\">›</span><span class=\"seg\">Show</span><span class=\"sep\">›</span><span class=\"seg\">Navigation Pane</span></span>. All four headings are listed down the left."},{"h":"Write about your company","p":"<p>Click at the end of <i>About us</i>, press <kbd>Enter</kbd> and write 2–3 sentences. Do the same under <i>Our product</i>.</p>","see":"Normal-sized writing under the first two headings, not more headings."},{"h":"Bullet your customers","p":"<p>Under <b>Who will buy it</b>, list at least three types of customer using <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Home</span><span class=\"sep\">›</span><span class=\"seg\">Paragraph</span><span class=\"sep\">›</span><span class=\"seg\">Bullets</span></span>.</p>","tip":"To stop the bullets, press <kbd>Enter</kbd> twice.","see":"At least three bullet points under <i>Who will buy it</i>."},{"h":"Add a price list table","p":"<p>Under <b>Price list</b>, click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Insert</span><span class=\"sep\">›</span><span class=\"seg\">Tables</span><span class=\"sep\">›</span><span class=\"seg\">Table</span></span> and drag out <b>3 columns × 3 rows</b>. Fill in Item, Size and Price. Then pick a look from <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Table Design</span><span class=\"sep\">›</span><span class=\"seg\">Table Styles</span></span>.</p>","vis":"<table class=\"wt\"><tr><th>Item</th><th>Size</th><th>Price</th></tr><tr><td>Cosmic Cookie</td><td>1 giant cookie</td><td>£1.00</td></tr><tr><td>Cookie Bundle</td><td>3 cookies</td><td>£2.50</td></tr></table>","tip":"<b>Guess your price.</b> Don't overthink it. Type your main price here too: <label class=\"guess\">My launch price guess: £<input data-save=\"guess\" inputmode=\"decimal\" maxlength=\"6\" aria-label=\"Launch price guess in pounds\"></label> In Lesson 4, Excel tells you whether your guess makes money.","see":"A table under <i>Price list</i> with your items and prices, in a coloured table style."},{"h":"Header and page number","p":"<p>Double-click the very top of the page to open the header and type your company name. Then click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Insert</span><span class=\"sep\">›</span><span class=\"seg\">Header &amp; Footer</span><span class=\"sep\">›</span><span class=\"seg\">Page Number</span></span> and choose <b>Bottom of Page</b>. Double-click the middle of the page to close the header.</p>","see":"Your company name at the top of the page, and a page number at the bottom."},{"h":"Check your spelling","p":"<p>Click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Review</span><span class=\"sep\">›</span><span class=\"seg\">Proofing</span><span class=\"sep\">›</span><span class=\"seg\">Editor</span></span> and fix every red and blue line.</p>","tip":"Try <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Review</span><span class=\"sep\">›</span><span class=\"seg\">Speech</span><span class=\"sep\">›</span><span class=\"seg\">Read Aloud</span></span>. Hearing your own writing is the best way to catch mistakes.","see":"No red or blue wavy lines left."}],"check":"My fact sheet has a Title, four Heading 1 headings, a bulleted list, a price table and my company name in the header. It's saved in OneDrive.","quests":[{"tier":"bronze","title":"One-click makeover","body":"<p>Change the whole look at once. Hover over the options in <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Design</span><span class=\"sep\">›</span><span class=\"seg\">Document Formatting</span></span> to preview them, then click one you like.</p><p><b>Tweak it:</b> try <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Design</span><span class=\"sep\">›</span><span class=\"seg\">Colors</span></span> and <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Design</span><span class=\"sep\">›</span><span class=\"seg\">Fonts</span></span>. Which look matches your brand? Why does this only work because you used styles?</p>"},{"tier":"silver","title":"Your brand colour","body":"<p>Make every heading your brand colour by changing the <b>style</b> once. Fill the gaps.</p><ol><li>In the Styles gallery, right-click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Home</span><span class=\"sep\">›</span><span class=\"seg\">Styles</span><span class=\"sep\">›</span><span class=\"seg gap\">? <i>which style</i></span></span></li><li>Choose <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg gap\">? <i>which option</i></span></span></li><li>Change the font and colour, then click <b>OK</b>.</li><li>Look: every heading changed by itself.</li></ol>","hints":["It's the style you used for your four headings.","You want to <i>change</i> the style. The option starts with M."]},{"tier":"gold","title":"Contents page","body":"<p>Add a table of contents at the top that links to each of your headings.</p><div class=\"area\"><div class=\"area-n\">Your turn: build it</div><div class=\"area-h\">A contents list under your title that lists every Heading 1.</div><div class=\"area-d\">You'll need: <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">References</span></span></div></div>","crit":["Contents lists all four headings","Ctrl + clicking a line jumps to that heading","You added a fifth heading, updated the contents, and it appeared"],"hints":["Look in the <b>References</b> tab.","Contents don't update by themselves. Click inside it and look for <b>Update Table</b>."]},{"tier":"legend","title":"House style guide","body":"<div class=\"brief\"><b>Brief:</b> Big companies have a style guide so everything they make looks the same. Make a one-page guide for your brand: your colours, your fonts, your logo, and three rules (e.g. <i>never stretch the logo</i>). Create at least one brand-new style of your own.</div>","crit":["Your brand colours shown as coloured shapes, with names","At least one new style you created, used in the guide","A logo made from shapes or icons","Three clear brand rules"],"hints":["New style: format some text how you want it, open the Styles gallery's <b>More</b> arrow and choose <b>Create a Style</b>.","Insert › Shapes, then Shape Format › Shape Fill › More Fill Colors lets you pick an exact colour.","Insert › Icons has thousands of free icons you can recolour."]}],"hw":{"title":"Make it your brand","builds":["silver","gold"],"time":"30 minutes","intro":"Finish your fact sheet at home and make it look like it belongs to a real company.","steps":["Open <i>Pitch It – Fact Sheet</i> from OneDrive.","If you didn't finish them in class, do the <b>Silver</b> quest (change Heading 1 to your brand colour) and the <b>Gold</b> quest (contents page).","Add a fifth section called <b>Why choose us?</b> using <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Home</span><span class=\"sep\">›</span><span class=\"seg\">Styles</span><span class=\"sep\">›</span><span class=\"seg\">Heading 1</span></span>, with three bullet points.","Update your contents page so the new heading appears.","Use <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Review</span><span class=\"sep\">›</span><span class=\"seg\">Speech</span><span class=\"sep\">›</span><span class=\"seg\">Read Aloud</span></span> to listen to the whole thing, and fix anything that sounds wrong."],"crit":["Every heading is in your brand colour, changed through the style","Contents lists all five headings","No red or blue lines left"]},"ped":{"doNow":[["In MakeCode, what does a <b>variable</b> do?",["Repeats code forever","Stores a value to use later","Draws a picture on the LEDs","Makes the program faster"],1,"A variable is a labelled box that stores a value. In Lesson 3 you'll meet Excel cells, which work the same way.","Term 2"],["Which MakeCode block runs again and again until the power goes off?",["on start","show string","forever","pause"],2,"<b>forever</b> loops. <b>on start</b> runs just once.","Term 2"],["Where should you save work so you can open it on any device?",["The Desktop","Downloads","OneDrive","A USB stick"],2,"OneDrive saves to the cloud and turns on AutoSave.","Earlier this year"],["Which shortcut undoes your last action?",["Ctrl + S","Ctrl + Z","Ctrl + U","Ctrl + P"],1,"Ctrl + Z is undo. Ctrl + S saves, Ctrl + U underlines, Ctrl + P prints.","Any time"]],"words":[["Style","A saved set of formatting (font, size, colour) you apply in one click."],["Heading","A title for one section of a document."],["Header / footer","The area at the top / bottom that repeats on every page."],["Table","A grid of rows and columns."],["Audience","The people a document is written for."]],"predict":{"8":"Before you run Editor: how many mistakes do you <b>think</b> you've made? Write the number down, then see if you were right."},"hinge":{"after":3,"q":["Sam makes his headings 16pt, bold and blue <b>by hand</b> instead of using Heading 1. Which of these will <b>not</b> work for Sam?",["They look like headings on screen","Clicking them in the Navigation Pane to jump there","Printing the document","Changing their colour one by one"],1,"Word only knows a line is a heading if it uses a <b>Heading</b> style. Looking like a heading isn't enough, so the Navigation Pane (and contents pages) can't see Sam's."]},"talk":{"h":"20-second pitch","p":"Tell your partner your company name, your product and who will buy it. Your partner must ask you one question. Then swap.","stems":["My company is called ___ and we sell ___.","Our customers will be ___ because ___.","<i>Partner:</i> Why would someone buy yours instead of ___?"]},"exit":[["What's the best reason to use <b>Heading 1</b> instead of making text big and bold?",["It's always bigger","You can change every heading at once and jump to them","Printers need it","It uses less memory"],1,"Styles let Word treat the line as a heading: restyle all at once, navigate, and build contents pages."],["Where would you put text that should appear at the top of <b>every</b> page?",["The title","A table","The header","The footer"],2,"The header repeats at the top of every page. The footer repeats at the bottom."],["Which tab has the <b>Table</b> button?",["Home","Insert","Layout","Review"],1,"Things you add to a document (tables, pictures, shapes) are on the <b>Insert</b> tab."]],"flip":"Before Lesson 2: notice two posters or flyers (around school, at home or in a shop). What's the first thing your eye goes to on each one?"},"ready":""},{"id":"L2","n":"Lesson 2","t":"Make a flyer","tag":"Word","app":"w","lede":"A flyer has about three seconds to grab someone walking past. Today you design one for your stall: big, bold and easy to read from across the corridor.","goals":["<b>Audience</b> → who is it for?","<b>Text wrapping</b> → pictures that go where you want","<b>Layout</b> → shapes and text boxes"],"steps":[{"h":"Plan before you click","p":"<p>Answer these in your head or on paper: <b>Who</b> will see it? <b>Where</b> will it go up? What do you want them to <b>do</b>?</p><p>Every flyer needs four things: <b>what</b> you sell, <b>when</b>, <b>where</b> and the <b>price</b>.</p>","tip":"Use the price you guessed last lesson: <b data-fill=\"guess\">£?</b>"},{"h":"Set up the page","p":"<p>New Word document, saved to OneDrive as <i>Pitch It – Flyer</i>. Then set <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Layout</span><span class=\"sep\">›</span><span class=\"seg\">Page Setup</span><span class=\"sep\">›</span><span class=\"seg\">Margins</span><span class=\"sep\">›</span><span class=\"seg\">Narrow</span></span> so you've got more room.</p>","see":"The writing area goes nearly to the edges of the page."},{"h":"Big headline","p":"<p>Type your company name and a catchy line. Make them huge, at least <b>48pt</b>. Try <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Insert</span><span class=\"sep\">›</span><span class=\"seg\">Text</span><span class=\"sep\">›</span><span class=\"seg\">WordArt</span></span> for the headline.</p>","tip":"Rule of thumb: no more than <b>two fonts</b> on one flyer. One for headings, one for everything else.","see":"Your company name, big enough to read from across the room."},{"h":"Add a picture","p":"<p>Click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Insert</span><span class=\"sep\">›</span><span class=\"seg\">Illustrations</span><span class=\"sep\">›</span><span class=\"seg\">Pictures</span><span class=\"sep\">›</span><span class=\"seg\">Stock Images</span></span>. Search for your product, click a picture you like, then click <b>Insert</b>.</p>","tip":"Stock Images are free to use. Pictures copied from Google usually aren't yours to use.","see":"Your picture on the page."},{"h":"Wrap the picture","p":"<p>Click the picture once. Then click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Picture Format</span><span class=\"sep\">›</span><span class=\"seg\">Arrange</span><span class=\"sep\">›</span><span class=\"seg\">Wrap Text</span><span class=\"sep\">›</span><span class=\"seg\">Square</span></span>.</p>","see":"You can drag the picture anywhere, and the writing moves out of its way."},{"h":"Shout the price","p":"<p>Click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Insert</span><span class=\"sep\">›</span><span class=\"seg\">Illustrations</span><span class=\"sep\">›</span><span class=\"seg\">Shapes</span></span> and pick a star or an explosion. Hold the left mouse button down and drag on the page to draw it. Right-click the shape → <b>Add Text</b> and type your price.</p>","see":"Your price inside the shape."},{"h":"When and where","p":"<p>Click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Insert</span><span class=\"sep\">›</span><span class=\"seg\">Text</span><span class=\"sep\">›</span><span class=\"seg\">Text Box</span></span> → <b>Simple Text Box</b>. Type when and where your stall is. To move the box, drag it by its edge.</p>","see":"A box saying when and where, which you can move around."},{"h":"The across-the-room test","p":"<p>Zoom out to <b>40%</b> with the slider at the bottom right, then lean back from your screen. Can you read the product, price, when and where? If not, make them bigger or cut words.</p>","see":"At 40%, you can still read the product, the price, when and where."}],"check":"My flyer shows what, when, where and the price, has a wrapped picture and a shape, and I can read it at 40% zoom.","quests":[{"tier":"bronze","title":"Icons and borders","body":"<p>Add an icon with <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Insert</span><span class=\"sep\">›</span><span class=\"seg\">Illustrations</span><span class=\"sep\">›</span><span class=\"seg\">Icons</span></span> and recolour it with <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Graphics Format</span><span class=\"sep\">›</span><span class=\"seg\">Graphics Styles</span><span class=\"sep\">›</span><span class=\"seg\">Graphics Fill</span></span>. Then add a border with <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Design</span><span class=\"sep\">›</span><span class=\"seg\">Page Background</span><span class=\"sep\">›</span><span class=\"seg\">Page Borders</span></span>.</p><p><b>Tweak it:</b> try the <b>Art</b> dropdown in the Page Borders box. Too much? Take it off. Knowing when to stop is a design skill.</p>"},{"tier":"silver","title":"Line it all up","body":"<p>Wonky layouts look amateur. Line your shapes up and group them so they move together. Fill the gaps.</p><ol><li>Click the first shape, then hold <span class=\"seg gap\">? which key</span> and click the others.</li><li>Click <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Shape Format</span><span class=\"sep\">›</span><span class=\"seg\">Arrange</span><span class=\"sep\">›</span><span class=\"seg gap\">? <i>which button</i></span><span class=\"sep\">›</span><span class=\"seg\">Align Center</span></span></li><li>Then <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Shape Format</span><span class=\"sep\">›</span><span class=\"seg\">Arrange</span><span class=\"sep\">›</span><span class=\"seg\">Group</span></span> so they stay together.</li></ol>","hints":["It's the key you hold for capital letters.","The button is called <b>Align</b> and has a list of options."]},{"tier":"gold","title":"Version for parents","body":"<p>Make a second flyer for the school newsletter that goes to parents. Same facts, different audience.</p><div class=\"area\"><div class=\"area-n\">Your turn: build it</div><div class=\"area-h\">A parents' version saved as a new file, so your student version stays safe.</div></div>","crit":["Fits in half a page","Words suit adults: polite, no slang","Explains <i>why</i> parents should come, not just what you sell","Saved as a separate file"],"hints":["File › Save As with a new name makes a copy.","What do parents care about? Price, healthy options, helping the school…"]},{"tier":"legend","title":"Fold-out leaflet","body":"<div class=\"brief\"><b>Brief:</b> Make a tri-fold leaflet: one A4 landscape sheet, printed on both sides and folded into three. You need a cover, a menu, an <i>About us</i> panel and how to find the stall.</div>","crit":["Two pages, landscape, three columns each","Column breaks so each panel starts in the right place","When folded, the cover is on the front (test with a folded paper mock-up)"],"hints":["Layout › Orientation, and Layout › Columns.","Layout › Breaks › Column jumps to the next column.","Fold a scrap of paper and number the panels first. The cover is <b>not</b> the first panel on page 1!"]}],"hw":{"title":"Flyer detective","builds":["bronze","silver"],"time":"30 minutes","intro":"Real designers study other people's work. Find a real flyer or poster, judge it, then use what you learn on your own.","steps":["Find a real flyer, poster or leaflet at home, in a shop window or through the letterbox.","In a new Word document, answer: Does it show <b>what</b>, <b>when</b>, <b>where</b> and the <b>price</b>? Can you read it from across the room? How many fonts does it use?","Write one thing it does well and one thing you'd change.","Now open your own flyer. Use what you learned to make <b>one improvement</b>. Then do the <b>Silver</b> quest if you haven't: line everything up with <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Shape Format</span><span class=\"sep\">›</span><span class=\"seg\">Arrange</span><span class=\"sep\">›</span><span class=\"seg\">Align</span></span> and group it."],"crit":["A short review of a real flyer, with one good point and one improvement","Your flyer improved, aligned and grouped"],"hand":"Hand in both files on Teams."},"ped":{"doNow":[["Which Word feature lets you change <b>every</b> heading at once?",["Styles","Spell check","Header","Word Count"],0,"Change the style once and every line using it updates.","Last lesson"],["Text at the bottom of every page goes in the…",["Title","Header","Footer","Table"],2,"Footer = bottom, header = top.","Last lesson"],["In MakeCode, <b>on button A pressed</b> is an example of…",["a variable","an event","a loop","a sprite"],1,"An event is code that waits for something to happen.","Term 2"],["Which of these is an <b>input</b> device?",["Monitor","Speaker","Keyboard","Printer"],2,"Inputs put data <i>into</i> a computer. The others are outputs.","Earlier this year"]],"words":[["Audience","Who the flyer is for."],["Purpose","What you want the flyer to make people do."],["Text wrapping","How text flows around a picture."],["Layout","Where everything is placed on the page."],["Font","The style of the letters."]],"predict":{"7":"Before you zoom out: which part of your flyer do you think will be <b>hardest</b> to read? Test it and see if you were right."},"hinge":{"after":4,"q":["You insert a picture but it won't let you drag it next to your text. What's the most likely reason?",["The picture is too big","You haven't saved yet","It's set to In Line with Text","Stock Images can't be moved"],2,"In Line with Text treats the picture like a giant letter stuck in a line. Change the wrapping to Square and you can drag it anywhere."]},"talk":{"h":"The 3-second test","p":"Swap laptops. Look at your partner's flyer for 3 seconds, then look away and say everything you remember. Your partner listens and doesn't help!","stems":["In three seconds I noticed ___.","I couldn't find the ___.","It would grab people's attention more if ___."]},"exit":[["A flyer for Year 7s and one for parents should…",["be exactly the same","have the same facts but different wording","have no pictures","use as many fonts as possible"],1,"Same facts, but the words and style change to suit the <b>audience</b>."],["Which wrap option lets text flow round the sides of a picture?",["In Line with Text","Square","Behind Text","In Front of Text"],1,"Square wraps the text around the picture's edges."],["Why use Stock Images instead of copying from Google Images?",["They're licensed, so you're allowed to use them","They're always higher quality","Word blocks Google","They take up less space"],0,"Most pictures online belong to someone. Stock Images in Office are free for you to use."]],"flip":"Before Lesson 3: write a list of 5 things you'd need to buy to make your product, including packaging."},"ready":"notice two posters or flyers (around school, at home or in a shop). What's the first thing your eye goes to on each one?"},{"id":"L3","n":"Lesson 3","t":"Count the costs","tag":"Excel","app":"x","locked":true,"quests":[{"tier":"bronze"},{"tier":"silver"},{"tier":"gold"},{"tier":"legend"}]},{"id":"L4","n":"Lesson 4","t":"Build the model","tag":"Excel","app":"x","locked":true,"quests":[{"tier":"bronze"},{"tier":"silver"},{"tier":"gold"},{"tier":"legend"}]},{"id":"L5","n":"Lesson 5","t":"Find the best price","tag":"Excel","app":"x","locked":true,"quests":[{"tier":"bronze"},{"tier":"silver"},{"tier":"gold"},{"tier":"legend"}]},{"id":"L6","n":"Lesson 6","t":"Build the pitch","tag":"PowerPoint","app":"p","locked":true,"quests":[{"tier":"bronze"},{"tier":"silver"},{"tier":"gold"},{"tier":"legend"}]},{"id":"L7","n":"Lesson 7","t":"Pitch day","tag":"PowerPoint","app":"p","locked":true,"quests":[{"tier":"bronze"},{"tier":"silver"},{"tier":"gold"},{"tier":"legend"}]}];

const BRIEF="<div class=\"lhead\"><div class=\"eyebrow\">START HERE</div><h1>Your mission</h1>\n<p class=\"lede\">You're starting a business. Your company will run a stall at the summer fair, but only if you can convince <b>the Den</b> it will make money. Over the next 7 lessons you'll write it up in <b>Word</b>, prove the numbers in <b>Excel</b> and pitch it in <b>PowerPoint</b>.</p></div>\n<div class=\"plan\">\n <div class=\"pc pc-w\"><b>Word</b><span>Lessons 1–2</span><p>Company fact sheet, then an eye-catching flyer.</p></div>\n <div class=\"pc pc-x\"><b>Excel</b><span>Lessons 3–5</span><p>Count the costs, build a profit model, find the best price.</p></div>\n <div class=\"pc pc-p\"><b>PowerPoint</b><span>Lessons 6–7</span><p>Five-slide pitch, then Pitch Day in front of the Den.</p></div>\n</div>\n<h2>How each lesson works</h2>\n<p class=\"lede\" style=\"margin-top:0\">Every lesson follows the same routine, so you always know what to do next:</p>\n<ol class=\"routine\">\n<li><b>Do Now:</b> quick quiz questions from earlier lessons. Start as soon as you sit down.</li>\n<li><b>Main task:</b> follow along with the teacher. Look out for <b>Predict first</b> boxes and the <b>Check before you carry on</b> question.</li>\n<li><b>Talk task:</b> explain, argue or present to a partner, using the sentence starters and key words.</li>\n<li><b>Side quests:</b> in class you should finish <b>Bronze, Silver and Gold</b>. Each gives less help and more XP. <b>Legend</b> is an extra challenge for when Gold is done.</li>\n<li><b>Exit ticket:</b> three questions and an honest confidence check, so your teacher knows what to go over.</li>\n</ol>\n__LADDER__\n<h2>Homework</h2>\n<p class=\"lede\" style=\"margin-top:0\">Every lesson has a red <b>Homework</b> button at the top. The homework builds on that lesson's Bronze, Silver or Gold quest, and takes about 30 minutes on your laptop. Hand it in on Teams.</p>\n<h2>Reading the instructions</h2>\n<p class=\"lede\" style=\"margin-top:0\">Grey boxes like this tell you where to click: the <b>tab</b>, then the <b>group</b>, then the <b>button</b>.</p>\n<p><span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Home</span><span class=\"sep\">›</span><span class=\"seg\">Styles</span><span class=\"sep\">›</span><span class=\"seg\">Heading 1</span></span> means: click the <b>Home</b> tab, find the <b>Styles</b> group, click <b>Heading 1</b>.</p>\n<p>The letter shows the app: <span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Word</span></span> <span class=\"rib rib-x\"><span class=\"ico\" aria-label=\"Excel\">X</span><span class=\"seg\">Excel</span></span> <span class=\"rib rib-p\"><span class=\"ico\" aria-label=\"PowerPoint\">P</span><span class=\"seg\">PowerPoint</span></span></p>\n<h2>Save everything in OneDrive</h2>\n<p class=\"lede\" style=\"margin-top:0\">Use the Office <b>apps</b> on your laptop, not the website. Save every file in OneDrive with a name starting <i>Pitch It –</i> so you can find them all together. Hand them in on Teams when your teacher asks.</p>";
const HELP="<div class=\"lhead\"><div class=\"eyebrow\">HELP</div><h1>Fixes &amp; tips</h1><p class=\"lede\">Check the list before asking. Real office workers spend loads of time fixing things!</p></div>\n<h2>Colour key</h2><p class=\"lede\" style=\"margin-top:0\">Apps:</p><p><span class=\"rib rib-w\"><span class=\"ico\" aria-label=\"Word\">W</span><span class=\"seg\">Word</span></span> <span class=\"rib rib-x\"><span class=\"ico\" aria-label=\"Excel\">X</span><span class=\"seg\">Excel</span></span> <span class=\"rib rib-p\"><span class=\"ico\" aria-label=\"PowerPoint\">P</span><span class=\"seg\">PowerPoint</span></span></p>\n<p class=\"lede\">Excel model cells (Home › Styles › Cell Styles):</p>\n<div class=\"xlwrap\"><div class=\"xlscroll\"><table class=\"xl\"><thead><tr><th></th><th>A</th><th>B</th><th>C</th></tr></thead><tbody><tr><th>1</th><td class=\"in\">Input</td><td class=\"calc\">Calculation</td><td class=\"out\">Output</td></tr></tbody></table></div></div>\n<p class=\"saveline\">Change the <b>inputs</b>. Never type over a <b>calculation</b> or the <b>output</b>.</p>\n<h2 id=\"basics\">Office basics</h2><p class=\"lede\" style=\"margin-top:0\">Mouse and menu skills you need in every lesson.</p><div class=\"tips basics\"><div class=\"bug\"><b>Scroll</b><p>Roll the wheel on the mouse to move up and down. In Excel, hold <kbd>Shift</kbd> and roll the wheel to move sideways. On a touchpad, slide two fingers.</p></div><div class=\"bug\"><b>Select cells</b><p>Click the first cell, hold the left button down and drag to the last cell. Or click the first cell, hold <kbd>Shift</kbd> and click the last one.</p></div><div class=\"bug\"><b>The fill handle</b><p>Click a cell and look for the tiny square at its bottom-right corner. Point at it until the pointer turns into a thin black <b>+</b>, then hold and drag.</p></div><div class=\"bug\"><b>Type in a cell</b><p>Click the cell, type, then press <kbd>Enter</kbd>. Press <kbd>Esc</kbd> to cancel. To change a formula, click the cell and edit it in the formula bar.</p></div><div class=\"bug\"><b>Right-click</b><p>Press the <b>right</b> mouse button on something to get a menu of things you can do to it.</p></div><div class=\"bug\"><b>Move a picture or box</b><p>Point at its edge until the pointer turns into a four-way arrow, then drag.</p></div><div class=\"bug\"><b>Can't see a button?</b><p>If the window is small, Office squashes the ribbon and hides buttons. Double-click the very top of the window to make it full size. Still missing? Type what you want in the <b>Search</b> box at the top (<kbd>Alt</kbd>+<kbd>Q</kbd>).</p></div><div class=\"bug\"><b>Sheets in Excel</b><p>The tabs at the bottom are separate sheets. Click <b>+</b> to add one, and double-click a tab to rename it.</p></div><div class=\"bug\"><b>Zoom</b><p>Drag the slider in the bottom-right corner, or hold <kbd>Ctrl</kbd> and roll the mouse wheel.</p></div><div class=\"bug\"><b>Undo a mistake</b><p>Press <kbd>Ctrl</kbd>+<kbd>Z</kbd>. Keep pressing it to go further back.</p></div></div>\n<h2>How to fix a problem</h2><ol class=\"tips\"><li class=\"bug\"><b>Save to OneDrive first</b><p>Save before you do anything else. Then AutoSave keeps your work safe.</p></li><li class=\"bug\"><b>Undo is your friend</b><p><kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes your last change. Keep pressing it to go further back.</p></li><li class=\"bug\"><b>Can't find a button?</b><p>Type what you want in the <b>Search</b> box at the top of the window, e.g. <i>wrap text</i>.</p></li><li class=\"bug\"><b>Hover for help</b><p>Hold the mouse over any button for a second to see what it does.</p></li><li class=\"bug\"><b>Check the cell, not the screen</b><p>In Excel, click a cell and read the formula bar. What you see in the cell is only the answer.</p></li><li class=\"bug\"><b>Change one thing, then test</b><p>Change three things at once and you won't know which one fixed it, or which one broke it.</p></li><li class=\"bug\"><b>Compare with the handbook</b><p>Put your work next to the step here. Same cells? Same formula? Same tab?</p></li><li class=\"bug\"><b>Ask three, then me</b><p>Ask three classmates before the teacher. Say what should happen, what actually happens, and what you've tried.</p></li></ol>\n<h2>Common problems</h2><div class=\"bugs\"><div class=\"bug\"><b>My formula shows as text, not an answer.</b><p>Formulas must start with <b>=</b>. If it still shows, the cell is formatted as Text: change it to General in Home › Number, then type the formula again.</p></div><div class=\"bug\"><b>My cell is full of ####.</b><p>The column is too narrow for the number. Double-click the line between the column letters to widen it.</p></div><div class=\"bug\"><b>#NAME?</b><p>Excel doesn't recognise a word in your formula. Check the spelling (SUM not SUMM), and put words in \"quote marks\".</p></div><div class=\"bug\"><b>#DIV/0!</b><p>You're dividing by an empty cell or zero. Check <i>Cookies made</i> has a number in it.</p></div><div class=\"bug\"><b>#REF!</b><p>The formula used a cell you deleted. Press Ctrl + Z to undo.</p></div><div class=\"bug\"><b>#VALUE!</b><p>You're doing maths with words. Type prices as numbers (1.5), not with letters (1.5 pounds).</p></div><div class=\"bug\"><b>Filling down gives wrong answers.</b><p>A cell that should stay the same is moving. Use $ signs: $B$1 (Lesson 5).</p></div><div class=\"bug\"><b>Profit doesn't change when I change the price.</b><p>You typed a number into a formula instead of a cell. Use =B2*B3, not =1*120.</p></div><div class=\"bug\"><b>My chart's bottom axis says 1, 2, 3 instead of prices.</b><p>You made a line chart. Click the chart › Chart Design › Change Chart Type › X Y (Scatter).</p></div><div class=\"bug\"><b>My picture jumps around or won't move.</b><p>It's In Line with Text. Click it › Picture Format › Wrap Text › Square.</p></div><div class=\"bug\"><b>My headings don't show in the Navigation Pane.</b><p>You made them big and bold by hand. Click each one and choose Heading 1.</p></div><div class=\"bug\"><b>My PowerPoint chart didn't update.</b><p>It was pasted as a picture. Paste again with <i>Use Destination Theme &amp; Link Data</i>, or click the chart › Chart Design › Refresh Data.</p></div><div class=\"bug\"><b>The bullets won't stop.</b><p>Press Enter twice, or press Backspace at the start of the line.</p></div><div class=\"bug\"><b>I've lost my work!</b><p>File › Open › Recent. Still gone? Look in OneDrive. You can also go back to older versions: File › Info › Version History.</p></div></div>\n<h2>Shortcuts</h2><table class=\"keys\"><tr><th><kbd>Ctrl</kbd>+<kbd>S</kbd></th><td>Save</td></tr><tr><th><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd></th><td>Undo / redo</td></tr><tr><th><kbd>Ctrl</kbd>+<kbd>C</kbd> <kbd>Ctrl</kbd>+<kbd>X</kbd> <kbd>Ctrl</kbd>+<kbd>V</kbd></th><td>Copy, cut, paste</td></tr><tr><th><kbd>Ctrl</kbd>+<kbd>B</kbd> <kbd>Ctrl</kbd>+<kbd>I</kbd> <kbd>Ctrl</kbd>+<kbd>U</kbd></th><td>Bold, italic, underline</td></tr><tr><th><kbd>F7</kbd></th><td>Spelling check (Word)</td></tr><tr><th><kbd>F4</kbd></th><td>Add $ signs (Excel)</td></tr><tr><th><kbd>Ctrl</kbd>+<kbd>`</kbd></th><td>Show formulas (Excel)</td></tr><tr><th><kbd>F5</kbd> / <kbd>Shift</kbd>+<kbd>F5</kbd></th><td>Start show / from this slide</td></tr><tr><th><kbd>Esc</kbd></th><td>End the slide show</td></tr></table>";
const WCATS=["All","Word","Excel","PowerPoint"];
const RANKS=[[0,"Intern"],[100,"Trainee"],[250,"Assistant"],[450,"Team Leader"],[700,"Manager"],[1000,"Director"],[1400,"CEO"],[2000,"Tycoon"]];
const TIERNAME={bronze:"Bronze",silver:"Silver",gold:"Gold",legend:"Legend"};
const LADDER=`<div class="ladder">
 <div><b>Bronze · Copy &amp; tweak</b>Every step is shown. Do it, then change it.</div>
 <div style="--t:var(--silver)"><b>Silver · Fill the gaps</b>Red dashed boxes are missing buttons, cells or values.</div>
 <div style="--t:var(--gold)"><b>Gold · Finish it</b>You get the goal and a checklist. You work out the steps.</div>
 <div style="--t:var(--legend)"><b>Legend · Extra challenge</b>Just the brief. Only once Gold is done. You plan it, build it and test it.</div></div>`;

/* ===== STATE (this browser only) ===== */
let S={done:{},mcq:{},conf:{},guess:"",tab:"BRIEF",wcat:"All"};
try{const s=JSON.parse(localStorage.getItem("pitchit-v1")||"null");if(s)S=Object.assign(S,s)}catch(e){}
S.mcq=S.mcq||{};S.conf=S.conf||{};
function save(){try{localStorage.setItem("pitchit-v1",JSON.stringify(S))}catch(e){}}

function xpOf(key){
  if(key.endsWith(":core"))return XP.core;
  const [lid,idx]=key.split(":q");const L=LESSONS.find(l=>l.id===lid);
  if(L&&idx!==undefined&&L.quests[+idx])return XP[L.quests[+idx].tier];
  const W=WORKSHOP.find(w=>w.id===key);return W?XP[W.tier]:0;
}
function totalXP(){return Object.keys(S.done).filter(k=>S.done[k]).reduce((a,k)=>a+xpOf(k),0)}
function maxXP(){let m=0;LESSONS.forEach(l=>{m+=XP.core;l.quests.forEach(q=>m+=XP[q.tier])});WORKSHOP.forEach(w=>m+=XP[w.tier]);return m}
let lastLevel=null;
function hud(){
  const x=totalXP();let i=0;RANKS.forEach(([t],k)=>{if(x>=t)i=k});
  const [lo,name]=RANKS[i],next=RANKS[i+1];
  document.getElementById("rank").textContent=`Level ${i+1} · ${name}`;
  if(next){
    document.getElementById("xpText").textContent=`${x-lo} / ${next[0]-lo} XP`;
    document.getElementById("nextRank").textContent=`Next: ${next[1]}`;
    document.getElementById("xpBar").style.width=((x-lo)/(next[0]-lo)*100)+"%";
  }else{
    document.getElementById("xpText").textContent=`${x} XP`;
    document.getElementById("nextRank").textContent="Top rank!";
    document.getElementById("xpBar").style.width="100%";
  }
  if(lastLevel!==null&&i>lastLevel){
    const h=document.querySelector(".xp");h.classList.remove("lvlup");void h.offsetWidth;h.classList.add("lvlup");
    if(CONFETTI)CONFETTI(Object.assign({particleCount:150,spread:100,origin:{y:.15}},CONF));
  }
  lastLevel=i;
}

/* ===== RENDER ===== */
function questHTML(key,q){
  const d=!!S.done[key];
  return `<details class="quest${d?" is-done":""}" data-tier="${q.tier}">
   <summary><span class="badge">${TIERNAME[q.tier]}</span><h3>${q.title}</h3><span class="xpv">+${XP[q.tier]} XP</span><span class="done-dot" aria-hidden="true"></span><span class="chev" aria-hidden="true">›</span></summary>
   <div class="qbody">${q.body}
    ${q.crit?`<div class="crit"><b>It's done when…</b><ul>${q.crit.map(c=>`<li>${c}</li>`).join("")}</ul></div>`:""}
    ${q.hints?`<div class="hints">${q.hints.map((h,i)=>`<details><summary>Stuck? Hint ${i+1}</summary><p>${h}</p></details>`).join("")}</div>`:""}
    <div class="check"><input type="checkbox" class="tick" id="t-${key}" data-k="${key}" ${d?"checked":""}><label for="t-${key}">I've done this and checked it works.</label></div>
   </div></details>`;
}
function map(){
  const m=document.getElementById("map");
  const t=[["BRIEF","Start here","The brief","s"],"sep"];
  LESSONS.forEach((l,i)=>{if(i===2||i===5)t.push("sep");t.push([l.id,l.n,l.t,l.app])});
  t.push("sep",["WS","Workshop","Extra quests","s"],["HELP","Help","Fixes & tips","s"]);
  m.innerHTML=t.map(x=>x==="sep"?'<span class="sep"></span>':`<button role="tab" data-app="${x[3]}" aria-selected="${S.tab===x[0]}" data-tab="${x[0]}"><span class="n">${x[1]}${isLocked(x[0])?' <span class="lk" aria-label="locked">🔒</span>':''}</span><span class="t">${x[2]}</span></button>`).join("");
}
function lesson(L){
  const ck=L.id+":core",P=L.ped;
  return `<div class="lhead">${L.hw?`<button class="hwbtn${S.done[L.id+":hw"]?" done":""}" data-hw="${L.id}">${hwLabel(L.id)}</button>`:""}<div class="eyebrow">${L.n.toUpperCase()} · ${L.tag.toUpperCase()}</div><h1>${L.t}</h1><p class="lede">${L.lede}</p><div class="goals">${L.goals.map(g=>`<span>${g}</span>`).join("")}</div></div>
   ${P?flowHTML(L):""}
   ${P?doNowHTML(L):""}
   <h2 id="sec-main">Main task <span class="xpv">+${XP.core} XP</span></h2>
   <p class="lede" style="margin-top:0">Follow along with your teacher. Get stuck? Every step is here. Do one step, check it matches <b>You should see</b>, then move on. Mouse or menus giving you trouble? See <a href="#HELP" data-tab="HELP"><b>Office basics</b></a> on the Help tab.</p>
   <div class="core">${L.steps.map((s,i)=>`<div class="step"><div class="num">${i+1}</div><div><h3>${s.h}</h3>${s.p}${P&&P.predict&&P.predict[i]?`<div class="predict"><span>Predict first</span>${P.predict[i]}</div>`:""}${s.vis||""}${s.tip?`<div class="tip">${s.tip}</div>`:""}${s.see?`<p class="see"><b>✔ You should see:</b> ${s.see}</p>`:""}</div></div>${P&&P.hinge&&P.hinge.after===i?hingeHTML(L):""}`).join("")}
    <div class="check"><input type="checkbox" class="tick" id="t-${ck}" data-k="${ck}" ${S.done[ck]?"checked":""}><label for="t-${ck}"><b>Checkpoint:</b> ${L.check}</label></div>
   </div>
   ${P?talkHTML(L):""}
   <h2 id="sec-quests">Side quests</h2>
   <p class="lede" style="margin-top:0"><b>In class, finish Bronze, Silver and Gold.</b> Each one gives you less help. Legend is an extra challenge if you finish Gold. Want something different? Try the <b>Workshop</b> tab.</p>
   ${LADDER}
   <div class="tiers">${L.quests.map((q,i)=>questHTML(L.id+":q"+i,q)).join("")}</div>
   ${P?exitHTML(L):""}`;
}
/* ===== PEDAGOGY BLOCKS ===== */
const FLOW=[["Do Now",5,"sec-dn"],["Main task",20,"sec-main"],["Talk task",5,"sec-talk"],["Bronze → Gold",20,"sec-quests"],["Exit ticket",5,"sec-exit"]];
function flowHTML(L){
  const f=L.ped.flow?L.ped.flow.map((x,i)=>[x[0],x[1],["sec-dn","sec-main","sec-main","sec-talk","sec-exit"][i]]):FLOW;
  return `<ol class="flow" aria-label="Lesson plan">${f.map(x=>`<li><a href="#${x[2]}" data-jump="${x[2]}"><b>${x[0]}</b><span>~${x[1]} min</span></a></li>`).join("")}</ol>`;
}
function mcqHTML(id,m,n){
  const [q,opts,a,why,from]=m,ch=S.mcq[id],done=ch!==undefined,ok=done&&ch===a;
  return `<div class="mcq${done?(ok?" got-right":" got-wrong"):""}" data-mcq="${id}" data-n="${n||""}">${from?`<span class="from">${from}</span>`:""}
   <p class="mq">${n?`<b>${n}.</b> `:""}${q}</p>
   <div class="opts">${opts.map((o,i)=>`<button class="opt${done&&i===a?" right":""}${done&&i===ch&&i!==a?" wrong":""}" data-opt="${i}" ${done?"disabled":""}><span class="ol">${"ABCD"[i]}</span>${o}</button>`).join("")}</div>
   ${done?`<p class="why"><b>${ok?"Correct!":"Not quite."}</b> ${why}</p>`:""}</div>`;
}
function findMcq(id){
  const [lid,kind,n]=id.split(":"),L=LESSONS.find(l=>l.id===lid);if(!L||!L.ped)return null;
  return kind==="dn"?L.ped.doNow[+n]:kind==="ex"?L.ped.exit[+n]:kind==="hg"?L.ped.hinge.q:null;
}
function score(L,kind){const arr=kind==="dn"?L.ped.doNow:L.ped.exit;let got=0,ans=0;arr.forEach((m,i)=>{const c=S.mcq[`${L.id}:${kind}:${i}`];if(c!==undefined){ans++;if(c===m[2])got++}});return {got,ans,tot:arr.length}}
function scoreHTML(L,kind){const s=score(L,kind);return `<span class="score" data-score="${L.id}:${kind}">${s.ans?`${s.got} / ${s.tot}`:`0 / ${s.tot}`}</span>`}
function doNowHTML(L){
  const P=L.ped;
  return `<h2 id="sec-dn">Do Now ${scoreHTML(L,"dn")}</h2>
   <p class="lede" style="margin-top:0">On your own, in silence, as soon as you sit down. These come from earlier lessons, so you don't forget them.</p>
   ${L.ready?`<div class="ready"><b>Flip check:</b> Before this lesson you were asked to: ${L.ready} <i>Share it with your partner in 30 seconds.</i></div>`:""}
   <div class="mcqs">${P.doNow.map((m,i)=>mcqHTML(`${L.id}:dn:${i}`,m,i+1)).join("")}</div>
   <button class="reset" data-reset="${L.id}:dn">Reset Do Now</button>
   <div class="words"><h3>Key words</h3><p class="wl">Use at least two of these when you talk today.</p><dl>${P.words.map(w=>`<div><dt>${w[0]}</dt><dd>${w[1]}</dd></div>`).join("")}</dl></div>`;
}
function hingeHTML(L){
  return `<div class="hinge"><div class="hh">Check before you carry on</div><p class="lede" style="margin:0 0 6px">Everyone answers. Show your teacher your answer when asked.</p>${mcqHTML(L.id+":hg:0",L.ped.hinge.q)}</div>`;
}
function talkHTML(L){
  const t=L.ped.talk;
  return `<h2 id="sec-talk">Talk task</h2><div class="talk"><h3>${t.h}</h3><p>${t.p}</p><div class="stems"><b>Sentence starters</b><ul>${t.stems.map(s=>`<li>${s}</li>`).join("")}</ul></div></div>`;
}
const CONF_LBL=["Not yet","Getting there","Got it"];
function exitHTML(L){
  const P=L.ped;
  return `<h2 id="sec-exit">Exit ticket ${scoreHTML(L,"ex")}</h2>
   <p class="lede" style="margin-top:0">Last 5 minutes, on your own. Be honest: this tells your teacher what to go over next time.</p>
   <div class="mcqs">${P.exit.map((m,i)=>mcqHTML(`${L.id}:ex:${i}`,m,i+1)).join("")}</div>
   <div class="conf"><h3>How confident are you?</h3>${L.goals.map((g,i)=>{const k=L.id+":"+i,v=S.conf[k];
     return `<div class="crow"><span class="cg">${g}</span><span class="cbtns" role="group">${CONF_LBL.map((c,j)=>`<button data-conf="${k}" data-v="${j}" aria-pressed="${v===j}" class="c${j}">${c}</button>`).join("")}</span></div>`}).join("")}</div>
   <button class="reset" data-reset="${L.id}:ex">Reset exit ticket</button>`;
}
function hwLabel(id){return S.done[id+":hw"]?"📝 Homework ✓ handed in":"📝 Homework"}
function hwHTML(L){
  const h=L.hw,k=L.id+":hw";
  return `<form method="dialog" class="hwclose"><button aria-label="Close homework">✕</button></form>
   <div class="hwstamp" aria-hidden="true">Homework</div>
   <div class="eyebrow">${L.n.toUpperCase()} · ${L.tag.toUpperCase()}</div><h1>${h.title}</h1>
   <div class="hwmeta"><span>⏱ About ${h.time}</span><span>Builds on: ${h.builds.map(t=>`<span class="badge" style="--t:var(--${t})">${TIERNAME[t]}</span>`).join(" ")}</span></div>
   <p class="hwintro">${h.intro}</p>
   <ol class="hwsteps">${h.steps.map(s=>`<li>${s}</li>`).join("")}</ol>
   <div class="crit" style="--t:var(--red)"><b>It's done when…</b><ul>${h.crit.map(c=>`<li>${c}</li>`).join("")}</ul></div>
   ${L.ped&&L.ped.flip?`<div class="hwflip"><b>Get ready for next lesson</b> ${L.ped.flip}</div>`:""}
   <p class="hwhand">📤 ${h.hand||"Save it in OneDrive and hand it in on Teams by the date your teacher gives you."}</p>
   <div class="check"><input type="checkbox" class="tick" id="t-${k}" data-k="${k}" ${S.done[k]?"checked":""}><label for="t-${k}">I've handed this in.</label></div>`;
}
function workshop(){
  const list=WORKSHOP.filter(w=>S.wcat==="All"||w.cat===S.wcat);
  const order={bronze:0,silver:1,gold:2,legend:3};list.sort((a,b)=>order[a.tier]-order[b.tier]);
  return `<div class="lhead"><div class="eyebrow">WORKSHOP · ANY ORDER</div><h1>Extra quests</h1><p class="lede">More things a real business would make. Do them in any order, whenever you've finished a lesson.</p></div>${LADDER}
   <div class="filters">${WCATS.map(c=>`<button data-wcat="${c}" aria-pressed="${S.wcat===c}">${c}</button>`).join("")}</div>
   <div class="wgrid">${list.map(w=>questHTML(w.id,w)).join("")}</div>`;
}
function fill(){
  const g=(S.guess||"").replace(/^£/,"").trim();
  document.querySelectorAll('[data-fill="guess"]').forEach(e=>e.textContent=g?"£"+g:"(not set yet: see Lesson 1, step 5)");
  document.querySelectorAll('[data-save]').forEach(e=>{if(document.activeElement!==e)e.value=S[e.dataset.save]||""});
}


/* ===== LESSON SWITCHES (set by the teacher in admin, per learning group) ===== */
const GATE={ready:false,open:new Set(),err:false,bad:new Set()};
function vaultLocked(id){return id==="WS"?WS_LOCKED:!!(LESSONS.find(l=>l.id===id)||{}).locked}
function isLocked(id){if(id==="BRIEF"||id==="HELP")return false;return !GATE.open.has(id)||vaultLocked(id)}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openVault(id,pw){
  const v=VAULT[id];if(!v)return false;
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(v.s),iterations:KDF_ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const data=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(v.i)},key,unb64(v.c))));
    if(id==="WS"){WORKSHOP=data;WS_LOCKED=false}
    else{const i=LESSONS.findIndex(l=>l.id===id);LESSONS[i]=data}
    return true;
  }catch(e){return false}
}
function lockScreen(id){
  const L=LESSONS.find(l=>l.id===id), name=id==="WS"?"Workshop":L.n+": "+L.t;
  const msg=GATE.err?"We can't reach the server right now. Check your internet connection, then refresh the page."
    :!GATE.ready?"Checking which lessons are open…"
    :GATE.bad.has(id)?"This lesson is switched on but didn't open on this device. Refresh the page, and tell your teacher if it still won't open."
    :"Your teacher will switch this on when it's time.";
  return `<div class="lockbox"><div class="lockicon" aria-hidden="true">🔒</div><div class="eyebrow">${GATE.ready&&!GATE.err?"NOT OPEN YET":"PLEASE WAIT"}</div><h1>${name}</h1>
   <p class="lede">${msg}</p></div>`;
}
const CONFETTI=window.confetti&&confetti.create?confetti.create(null,{resize:true,useWorker:false}):null;
const CONF={colors:["#c62828","#185abd","#107c41","#c43e1c","#fff176"],disableForReducedMotion:true,useWorker:false};
async function autoUnlock(){
  let st;
  try{st=await Abity.state()}catch(e){GATE.err=true;GATE.ready=true;render();return}
  if(!st){location.replace("/?next="+encodeURIComponent(location.pathname+location.hash));return}
  const it=(st.items||[]).find(i=>i.item==="pitchit");
  if(!it){location.replace("/group");return}
  for(const l of it.lessons){
    if(!l.open)continue;
    GATE.open.add(l.lesson);
    if(vaultLocked(l.lesson)&&!(l.key&&window.crypto&&crypto.subtle&&await openVault(l.lesson,l.key)))GATE.bad.add(l.lesson);
  }
  GATE.ready=true;
  const back=document.getElementById("backlink");if(back)back.textContent="← "+st.year+st.group;
  const nm=document.getElementById("stuName"),cl=document.getElementById("stuClass");
  if(nm&&st.name){S.name=st.name;nm.value=st.name}
  if(cl){S.cls=st.year+st.group;cl.value=S.cls}
  save();render();
}
function render(){
  map();const v=document.getElementById("view");
  const L=LESSONS.find(l=>l.id===S.tab);
  v.innerHTML=isLocked(S.tab)?lockScreen(S.tab):L?lesson(L):S.tab==="WS"?workshop():S.tab==="HELP"?HELP:BRIEF.replace("__LADDER__",LADDER);
  const pw=document.getElementById("pw");if(pw)pw.focus({preventScroll:true});
  fill();hud();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab]");if(t){S.tab=t.dataset.tab;save();render();window.scrollTo({top:0,behavior:"smooth"});return}
  const c=e.target.closest("[data-wcat]");if(c){S.wcat=c.dataset.wcat;save();render();return}
  const op=e.target.closest("[data-opt]");if(op){const box=op.closest("[data-mcq]"),id=box.dataset.mcq,m=findMcq(id);if(!m||S.mcq[id]!==undefined)return;
    S.mcq[id]=+op.dataset.opt;save();if(window.Abity)Abity.answer("pitchit",id,S.mcq[id]);box.outerHTML=mcqHTML(id,m,box.dataset.n?+box.dataset.n:0);
    const [lid,kind]=id.split(":"),L=LESSONS.find(l=>l.id===lid),sc=document.querySelector(`[data-score="${lid}:${kind}"]`);if(sc&&kind!=="hg")sc.outerHTML=scoreHTML(L,kind);
    if(S.mcq[id]===m[2]&&CONFETTI)CONFETTI(Object.assign({particleCount:30,spread:50,origin:{y:.7}},CONF));return}
  const cf=e.target.closest("[data-conf]");if(cf){S.conf[cf.dataset.conf]=+cf.dataset.v;save();cf.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===cf));return}
  const rs=e.target.closest("[data-reset]");if(rs){const p=rs.dataset.reset+":";Object.keys(S.mcq).forEach(k=>{if(k.startsWith(p))delete S.mcq[k]});save();const y=scrollY;render();scrollTo(0,y);return}
  const jp=e.target.closest("[data-jump]");if(jp){e.preventDefault();const el=document.getElementById(jp.dataset.jump);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});return}
  const hb=e.target.closest("[data-hw]");if(hb){const L=LESSONS.find(l=>l.id===hb.dataset.hw);const d=document.getElementById("hwDlg");d.innerHTML=hwHTML(L);d.showModal();d.scrollTop=0;return}
  if(e.target.id==="hwDlg")e.target.close();
});
document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.k;
  if(k){S.done[k]=e.target.checked;save();hud();const q=e.target.closest(".quest");if(q)q.classList.toggle("is-done",e.target.checked);
    if(k.endsWith(":hw")){const b=document.querySelector(`[data-hw="${k.split(":")[0]}"]`);if(b){b.textContent=hwLabel(k.split(":")[0]);b.classList.toggle("done",e.target.checked)}}
    if(e.target.checked&&CONFETTI)CONFETTI(Object.assign({particleCount:70,spread:65,origin:{y:.7}},CONF));}
});
document.addEventListener("input",e=>{
  const d=e.target.dataset||{};
  if(d.save){S[d.save]=e.target.value;save();fill()}
});
if(/^#(BRIEF|L[1-7]|WS|HELP)$/.test(location.hash))S.tab=location.hash.slice(1);
render();
autoUnlock();
</script>
