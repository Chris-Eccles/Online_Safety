<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Abity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315233a'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' text-anchor='middle' fill='%23ffd457'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/chat.css">
<script src="/chat.js"></script>
</head>
<body>

<div class="lock" id="lock">
  <div class="box">
    <h1>Abity</h1>
    <p>Enter your password to continue.</p>
    <input id="pw" aria-label="Password" placeholder="Password">
    <p class="err" id="err" role="alert"></p>
    <button class="btn" id="go" type="button">Continue</button>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="bar">
    <div class="who"><b id="them"></b><small>Private chat</small></div>
    <button class="icon" id="lockBtn" type="button" aria-label="Lock" title="Lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </button>
  </header>
  <main class="feed" id="feed" aria-live="polite"></main>
  <div class="attach" id="attach" hidden></div>
  <div class="compose">
    <button class="icon" id="photo" type="button" aria-label="Add a picture" title="Add a picture">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
    </button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="text" rows="1" placeholder="Message" aria-label="Message" autocomplete="off"></textarea>
    <button class="icon send" id="send" type="button" aria-label="Send" title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</div>

<script>
/* Nothing is remembered on this device: the pass to the chat lives only in this page while it's open.
   Reloading, going back, or leaving the page in the background for two minutes locks it again. */
(function(){
  var pass = null, room = null, hiddenAt = 0;
  var pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
  Chat.secretBox(pw);

  function lock(){
    pass = null;
    if (room) room.stop(); room = null;
    document.getElementById("feed").innerHTML = "";
    document.getElementById("text").value = "";
    document.getElementById("attach").hidden = true;
    document.getElementById("app").hidden = true;
    document.getElementById("lock").hidden = false;
    document.title = "Abity";
    Chat.clearSecret(pw); err.textContent = ""; go.disabled = false;
  }
  async function unlock(){
    var typed = Chat.secretValue(pw).trim();
    if (!typed) { err.textContent = "Enter your password."; return; }
    go.disabled = true; err.textContent = "";
    var r = await Chat.api("/unlock", { password: typed });
    Chat.clearSecret(pw); typed = "";
    go.disabled = false;
    if (!r.ok || !r.data.pass){ err.textContent = r.data.error || "That password isn't right."; pw.focus(); return; }
    pass = r.data.pass;
    open();
  }
  function open(){
    document.getElementById("lock").hidden = true;
    document.getElementById("app").hidden = false;
    var h = function(){ return { "x-chat-pass": pass }; };
    room = Chat.Room({
      feed: document.getElementById("feed"), input: document.getElementById("text"), sendBtn: document.getElementById("send"),
      photoBtn: document.getElementById("photo"), fileInput: document.getElementById("file"), attachBox: document.getElementById("attach"),
      mine: "guest",
      load: function(q){ return Chat.api("/messages" + (q ? "?" + q : ""), null, h()); },
      send: function(p){ return Chat.api("/send", p, h()); },
      uploadUrl: function(type){ return Chat.api("/upload-url", { type: type }, h()); },
      onInfo: function(d){ if (d.them) document.getElementById("them").textContent = d.them; },
      onSignedOut: function(){ lock(); err.textContent = "Please enter your password again."; }
    });
  }

  go.onclick = unlock;
  pw.addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); unlock(); } });
  document.getElementById("lockBtn").onclick = lock;
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) hiddenAt = Date.now();
    else if (pass && Date.now() - hiddenAt > 120000) lock();
  });
  window.addEventListener("pageshow", function(e){ if (e.persisted) lock(); });
  lock();
  pw.focus();
})();
</script>
</body>
</html>
